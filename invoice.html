<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15110d"><title>الأصيل - فاتورة المباخر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f4f1ec;--card:#fff;--text:#241b14;--muted:#74685d;--accent:#b86b24;--accent2:#172b3a;--line:#ddd3c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif}
header{background:#15110d;color:#fff;padding:15px;position:sticky;top:0;z-index:10}header .wrap,main{max-width:1050px;margin:auto}
header h1{margin:0;font-size:20px}.sub{font-size:12px;color:#cdbfae}
main{padding:15px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--accent);color:white;font-family:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:#eee7df;color:#3a2d23}.btn.dark{background:var(--accent2)}.btn.whatsapp{background:#198754}.duplicate{background:#fff1ed!important;border-color:#c94b2c!important}.duplicate-msg{color:#b43b20;font-size:11px;font-weight:700;margin-top:3px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}.product-select{min-width:240px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right}th{background:#f1eae2;font-size:13px}td input,td select{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;font:inherit;background:white}.num{direction:ltr;text-align:center}.remove{border:0;background:#f6e1db;color:#a23c1d;border-radius:7px;padding:7px 10px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:800;padding-top:10px}.hint{font-size:12px;color:var(--muted)}
.invoice{background:white;color:#111;padding:32px;max-width:900px;margin:auto;border-top:7px solid var(--accent2);box-shadow:0 6px 30px rgba(0,0,0,.08)}.invoice h2{text-align:center;margin:0 0 8px;color:var(--accent2);font-size:27px}.invoice table{border:1px solid #d9d1c8;border-radius:8px;overflow:hidden}.invoice tbody tr:nth-child(even){background:#faf7f2}.company-name{text-align:center;font-size:24px;font-weight:800;margin-bottom:4px}.invoice .meta{display:flex;justify-content:space-between;border-bottom:2px solid #222;padding:10px 0 14px;margin-bottom:14px}.invoice table{min-width:0}.invoice th{background:var(--accent2);color:#fff;font-weight:800}.invoice td{border-left:1px solid #eee}.invoice .sum{text-align:left;font-weight:800;font-size:18px;margin-top:15px}
@media(max-width:600px){.fields{grid-template-columns:1fr}.toolbar .btn{flex:1}.panel{padding:11px}}
@media print{body{background:#fff}.no-print,header,main>.panel:not(.invoice-panel){display:none!important}.invoice-panel{border:0;padding:0;margin:0}.invoice{display:block!important;max-width:none;padding:10mm}.invoice table{font-size:12px}.invoice th,.invoice td{padding:6px}}
</style></head>
<body>
<header><div class="wrap"><h1>الأصيل — نظام فاتورة المباخر</h1><div class="sub">قائمة الأصناف والأسعار — تعديل الكود والكمية والسعر ثم تصدير ومشاركة PDF</div></div></header>
<main>
<section class="panel no-print">
<div class="fields">
<div class="field"><label>اسم العميل</label><input id="customer" placeholder="اسم العميل"></div>
<div class="field"><label>رقم الفاتورة</label><input id="invoiceNo"></div>
</div>
</section>
<section class="panel no-print">
<div class="toolbar">
<button class="btn" id="add">+ إضافة صنف</button>
<button class="btn dark" id="pdf">📄 تصدير PDF</button>
<button class="btn whatsapp" id="share">🟢 إرسال إلى واتساب</button>
<button class="btn secondary" id="clear">مسح الكل</button>
</div>
<p class="hint">اضغط على خانة الصنف واختر المنتج من القائمة. يمكنك تعديل الكمية والسعر، وسيتم تنبيهك إذا أضفت نفس الصنف مرتين.</p>
</section>
<section class="panel no-print">
<div class="tablewrap"><table><thead><tr><th>كود الصنف</th><th>اسم الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="total"><span>الإجمالي الكلي</span><span id="grand">0.00</span></div>
</section>
<section class="panel invoice-panel">
<div id="invoice" class="invoice"></div>
</section>
</main>
<script>
const seed=[
["8-17","مبخرة فحم",90],["8-11","مبخرة فحم",100],["8-8","مبخرة اسلامي صغير فحم",100],["8-3","مبخرة فحم مأذنة",125],
["1-23","مبخرة بورسلين بقاعدة",125],["1-24","مبخرة فحم",135],["1-3","مبخرة كورة صغير فحم",135],["8-5","مبخرة فحم",145],
["8-7","مبخرة فحم",145],["8-6","مبخرة فحم",145],["1-7","مبخرة فحم",180],["8-27","مبخرة فحم",180],
["8-9","مبخرة فحم",180],["8-18","مبخرة فحم",180],["8-10","مبخرة فحم",180],["1-4","مبخرة فحم",180],
["1-5","مبخرة ريشة بورسلين",200],["1-9","مبخرة فحم",250],["1-6","مبخرة فحم",250],["1-1","طقم صواني دائري فحم",575],
["1-2","طقم صواني مربع فحم",575],["1-8","ماسك فحم",20],["1-10","مبخرة كورة كهربا صغير",185],
["1-11","مبخرة إسلامي كهربا وسط",200],["1-12","مبخرة كهربا ريشة",200],["1-25","مبخرة كهربا كورة وسط",225],
["1-13","مبخرة كهربا",285],["1-16","مبخرة كهربا",335],["1-14","مبخرة كهربا",335],["1-15","مبخرة كهربا",335],
["1-18","مبخرة كهربا",335],["1-17","مبخرة واباجورة",350],["1-19","مبخرة واباجورة",385],["1-21","مبخرة وإباجورة",385],
["1-27","مبخرة وإباجورة",385],["1-20","مبخرة وإباجورة",385],["8-1","مبخرة وإباجورة فحم",450],["1-26","مبخرة واباجورة كهربا",520],
["1-22","مبخرة وإباجورة كهربا",520],["1-28","مبخرة بخور الكترونية شحن",550],
["9-1","USB X50",75],["9-5","تسلا USB",95],["9-3","H2O USB",100],["9-12","بركان USB",160],["9-4","كبير H2O USB",115],
["9-8","خشبي USB",125],["9-9","خشبي كورة USB",125],["9-16","خشبي USB",125],["9-7","نيزك USB",150],["9-11","عصفورة USB",185],
["9-13","بيت الغزال USB",185],["9-6","دبدوب USB",185],["9-10","جمر USB",185],["2-8","قمر كبير USB",200],["2-9","زوحل USB",230],
["117-09","كبير USB",230],["9-2","بيانو USB",300],["2-7","لهب الغزال",300],["9-14","فواحة الجرامافون",950],["FT-504A","خشبي بدون بلوتوث",515],
["T269","وردة وعباد",550],["2-2","دمعة كبير",550],["117-02","بلوتوث ابيض",550],["117-2-1","رفيع الوان",550],["117-01","طوق عريض",550],
["T-298P","رفيع اسود",570],["2-6","جادور اسود",590],["T-569P","عمود 2x1",590],["T-2213","دورق كبير",590],["T-605","بكرة 4 عادي",850],
["2-5","تاتش شفاف",850],["2-3","تاتش اسود وابيض",865],["T-331","ديجتال شاشة",950],["T-606","ديجتال 4 لتر",1200],
["T-517","البازوكا",1400],["T-2310","رافال 9 لتر",2200],["2-1","جهاز تعطير المنزل",2500],["2-10","جهاز التعطير الذكي للبيت والسيارة",985],
["10-7","فريسكا",14],["7-2","فريسكا مشكل",15],["10-5","فريسكا AROMA THERAPIE",16],["10-3","فريسكا",17],["10-6","فريسكا",17],["7-3","مشكل الوان",20],["10-1","فريسكا الوان AROMA THERAPIE",20]
];
let items=seed.map(x=>({code:x[0],name:x[1],qty:0,price:x[2]})); const $=id=>document.getElementById(id);
$("invoiceNo").value=String(Date.now()).slice(-6);
function add(item=["","","",0]){items.push({code:item[0]||"",name:item[1]||"",qty:item[2]||1,price:item[3]||0});render()}
function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function productOptions(selected){
 return '<option value="">اختر الصنف من القائمة...</option>'+seed.map((x,i)=>'<option value="'+i+'" '+(selected===i?'selected':'')+'>'+esc(x[0]+' — '+x[1]+' — '+x[2])+'</option>').join("");
}
function render(){
 $("rows").innerHTML=items.map((x,i)=>{
   const selected=seed.findIndex(p=>p[0]===x.code&&p[1]===x.name&&Number(p[2])===Number(x.price));
   const duplicate=selected>=0 && items.some((y,j)=>j!==i&&y.code===x.code&&y.name===x.name);
   return '<tr class="'+(duplicate?'duplicate':'')+'"><td><b>'+esc(x.code||"—")+'</b></td><td><select class="product-select" data-i="'+i+'" data-k="product">'+productOptions(selected)+'</select>'+(duplicate?'<div class="duplicate-msg">⚠️ هذا الصنف مضاف بالفعل</div>':'')+'</td><td><input class="num" type="number" min="0" value="'+x.qty+'" data-i="'+i+'" data-k="qty"></td><td><input class="num" type="number" min="0" step="0.01" value="'+x.price+'" data-i="'+i+'" data-k="price"></td><td class="num">'+(x.qty*x.price).toFixed(2)+'</td><td><button class="remove" data-del="'+i+'">×</button></td></tr>';
 }).join("");
 document.querySelectorAll("[data-k]").forEach(e=>e.oninput=()=>{
   const i=Number(e.dataset.i),k=e.dataset.k;
   if(k==="product"){
     const p=seed[Number(e.value)];
     if(p){items[i].code=p[0];items[i].name=p[1];items[i].price=p[2];items[i].qty=items[i].qty||1}
     render();
     return;
   }
   items[i][k]=Number(e.value)||0;
   const row=e.closest("tr");if(row){const totalCell=row.children[4];if(totalCell)totalCell.textContent=(items[i].qty*items[i].price).toFixed(2)}
   $("grand").textContent=items.reduce((s,x)=>s+x.qty*x.price,0).toFixed(2);renderInvoice();
 });
 document.querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{items.splice(Number(e.dataset.del),1);render()});
 $("grand").textContent=items.reduce((s,x)=>s+x.qty*x.price,0).toFixed(2);renderInvoice()
}
function renderInvoice(){
 const total=items.reduce((s,x)=>s+x.qty*x.price,0);
 $("invoice").innerHTML='<div class="company-name">الأصيل للاستيراد الفوحات والمباخر</div><h2>فاتورة</h2><div class="meta"><span>العميل: <b>'+esc($("customer").value||"—")+'</b></span><span>رقم الفاتورة: <b>'+esc($("invoiceNo").value)+'</b><br>التاريخ: '+new Date().toLocaleDateString("ar-EG")+'</span></div><table><thead><tr><th>كود الصنف</th><th>اسم الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+items.filter(x=>x.qty>0).map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+Number(x.price).toFixed(2)+'</td><td>'+Number(x.qty*x.price).toFixed(2)+'</td></tr>').join("")+'</tbody></table><div class="sum">الإجمالي الكلي: '+total.toFixed(2)+'</div>'
}
$("add").onclick=()=>add(["","","",0]);
$("customer").oninput=renderInvoice;$("invoiceNo").oninput=renderInvoice;
$("clear").onclick=()=>{if(confirm("مسح جميع الأصناف؟")){items=[];render()}};
$("pdf").onclick=async()=>{renderInvoice();const el=$("invoice");await html2pdf().set({margin:8,filename:"فاتورة-الأصيل-"+$("invoiceNo").value+".pdf",image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(el).save()};
$("share").onclick=async()=>{renderInvoice();const el=$("invoice");try{const fileName="فاتورة-الأصيل-"+$("invoiceNo").value+".pdf";const blob=await html2pdf().set({margin:8,filename:fileName,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(el).outputPdf("blob");const file=new File([blob],fileName,{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:"فاتورة الأصيل",text:"فاتورة طلبية",files:[file]});}else{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=file.name;a.click();URL.revokeObjectURL(u);window.open("https://wa.me/?text="+encodeURIComponent("فاتورة الأصيل رقم "+$("invoiceNo").value+" جاهزة للإرسال"),"_blank");alert("تم إنشاء PDF. من شاشة واتساب اختر جهة الاتصال ثم أرفق ملف PDF الذي تم تنزيله.")}}catch(e){alert("تعذر إنشاء/مشاركة PDF: "+e.message)}};
render();
</script></body></html>
