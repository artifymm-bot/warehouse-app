<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مخزن الأصيل - إدارة الطلبات</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#15110D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مخزن الأصيل">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ash:#15110D;--ash-2:#1D1712;--bone:#EDE6D8;--bone-dim:#A89C89;--ember:#C6501F;--ember-bright:#E6712E;--gold:#B69A5C;--line:#3A322B;--ok:#4C8B5B;--ok-bright:#6BB57C}
  *{margin:0;padding:0;box-sizing:border-box} html,body{overscroll-behavior-y:none} body{background:var(--ash);color:var(--bone);font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100vh;padding-bottom:90px;padding-top:env(safe-area-inset-top)} h1,h2,h3,.display{font-family:'Cairo',sans-serif;font-weight:800} button,input,select,textarea{font-family:inherit} input,select,textarea{background:var(--ash-2);border:1px solid var(--line);color:var(--bone);border-radius:8px;padding:12px 14px;font-size:.95rem;width:100%} input::placeholder,textarea::placeholder{color:var(--bone-dim)} label{font-size:.85rem;color:var(--bone-dim);margin-bottom:6px;display:block}.field{margin-bottom:16px} header{padding:22px 20px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between} header h1{font-size:1.15rem} header h1 span{color:var(--ember-bright)}.gear{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--bone-dim);font-size:1.1rem} main{max-width:560px;margin:0 auto;padding:20px 16px 40px}.card{background:var(--ash-2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:9px;font-weight:600;font-size:.95rem;border:none;cursor:pointer;width:100%}.btn-primary{background:var(--ember);color:var(--bone)}.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--bone-dim)}.btn-ok{background:var(--ok);color:var(--bone)}.btn-wa{background:#2E5E3E;color:var(--bone)}.btn-sm{width:auto;padding:9px 14px;font-size:.85rem}.btn-danger{background:transparent;border:1px solid #6B3A2A;color:#D98066}.btn[disabled]{opacity:.45;cursor:not-allowed}.item-row{display:grid;grid-template-columns:1.4fr .6fr 40px;gap:8px;margin-bottom:10px;align-items:center}.item-row select,.item-row input{font-size:.88rem;padding:10px}.item-row .rm{background:none;border:none;color:var(--bone-dim);font-size:1.2rem;cursor:pointer}.kicker{color:var(--gold);font-size:.8rem;letter-spacing:1px;margin-bottom:6px}nav.tabs{position:fixed;bottom:0;right:0;left:0;background:var(--ash-2);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}nav.tabs button{flex:1;background:none;border:none;color:var(--bone-dim);padding:12px 4px 10px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:4px}nav.tabs button .ic{font-size:1.25rem}nav.tabs button.active{color:var(--ember-bright)}.order-card{background:var(--ash-2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;cursor:pointer}.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.order-card .cust{font-family:'Cairo',sans-serif;font-weight:700;font-size:1.02rem}.order-card .date{color:var(--bone-dim);font-size:.8rem}.order-card .meta{color:var(--bone-dim);font-size:.85rem}.badge{font-size:.72rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--bone-dim)}.badge.done{color:var(--ok-bright);border-color:var(--ok)}.check-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}.check-row:last-child{border-bottom:none}.check-row input[type=checkbox]{width:26px;height:26px;accent-color:var(--ok);flex-shrink:0}.check-row .info{flex:1}.check-row .pname{font-weight:600;font-size:.98rem}.check-row .pname.picked{text-decoration:line-through;color:var(--bone-dim)}.qty-pill{background:var(--ash);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:.9rem}.progress-bar{height:6px;background:var(--ash);border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress-bar .fill{height:100%;background:var(--ok);transition:width .3s ease}.prod-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}.prod-row:last-child{border-bottom:none}.empty{text-align:center;color:var(--bone-dim);padding:50px 20px;font-size:.92rem}.back-link{color:var(--gold);font-size:.85rem;margin-bottom:14px;display:inline-block;cursor:pointer}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.modal{background:var(--ash-2);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:400px}.modal h3{margin-bottom:14px;font-size:1.05rem}.modal .row2{display:flex;gap:10px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:var(--bone);padding:11px 22px;border-radius:99px;font-size:.9rem;z-index:60;opacity:0;transition:opacity .3s ease;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}.install-banner{background:var(--ember);color:var(--bone);padding:12px 16px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;font-size:.88rem}.install-banner button{background:var(--ash);color:var(--bone);border:none;border-radius:7px;padding:8px 14px;font-size:.82rem}
</style></head><body>
<header><h1>مخزن الأصيل <span>•</span> الطلبات</h1><button class="gear" id="settingsBtn">⚙︎</button></header><main id="app"></main>
<nav class="tabs"><button data-tab="new" class="active"><span class="ic">📝</span>طلب جديد</button><button data-tab="pack"><span class="ic">📦</span>تأكيد التحضير</button><button data-tab="catalog"><span class="ic">🏷️</span>الأصناف</button></nav><div class="toast" id="toast"></div>
<script>
const DEFAULT_PRODUCTS=[{id:'p1',name:'مبخرة 3-4'},{id:'p2',name:'مبخرة كريستال'},{id:'p3',name:'دخون كمبودي'},{id:'p4',name:'عود معطر درجة أولى'},{id:'p5',name:'بخور مستكة'},{id:'p6',name:'دهن عود ملكي'}];
let products=[],orders=[],packerPhone='',currentTab='new',openOrderId=null,newOrderRows=[{product:'',qty:1,note:''}],deferredInstallPrompt=null;
function getJSON(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){return fallback}} function setJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){console.error('storage error',e)}} function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function loadAll(){products=getJSON('mk_products',null);if(!products){products=DEFAULT_PRODUCTS;setJSON('mk_products',products)}orders=getJSON('mk_orders',[]);packerPhone=getJSON('mk_packer_phone','')} function saveProducts(){setJSON('mk_products',products)} function saveOrders(){setJSON('mk_orders',orders)} function savePackerPhone(){setJSON('mk_packer_phone',packerPhone)} function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function switchTab(tab){currentTab=tab;openOrderId=null;document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()} document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));document.getElementById('settingsBtn').addEventListener('click',openSettingsModal);
function formatLocalEgyptPhone(phone){const p=String(phone||'').replace(/\D/g,'');if(p.startsWith('20')&&p.length===12)return '0'+p.slice(2);if(p.startsWith('01'))return p.slice(0,11);return p} function isValidEgyptPhone(phone){return /^01[0125][0-9]{8}$/.test(String(phone||'').replace(/\D/g,''))}
function openSettingsModal(){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal"><h3>الإعدادات</h3><div class="field"><label>رقم واتساب المحضّر</label><div class="row2"><select id="countryCode" style="max-width:145px"><option value="20" selected>🇪🇬 +20 مصر</option></select><input id="phoneInput" value="${formatLocalEgyptPhone(packerPhone)}" inputmode="numeric" maxlength="11" placeholder="010xxxxxxxx"></div><small style="display:block;color:var(--bone-dim);margin-top:6px">اكتب الرقم المصري المحلي مثل 010xxxxxxxx. سيتم حفظه تلقائياً بصيغة واتساب الدولية.</small></div><div class="row2"><button class="btn btn-primary" id="savePhoneBtn">حفظ</button><button class="btn btn-ghost" id="closeSettingsBtn">إلغاء</button></div></div>`;document.body.appendChild(bg);document.getElementById('closeSettingsBtn').onclick=()=>bg.remove();document.getElementById('savePhoneBtn').onclick=()=>{const localPhone=document.getElementById('phoneInput').value.trim();if(!isValidEgyptPhone(localPhone)){showToast('اكتب رقم مصري صحيح يبدأ بـ 01');return}packerPhone='20'+localPhone.replace(/^0/,'');savePackerPhone();bg.remove();showToast('تم حفظ رقم المحضّر')};}
function openWhatsAppModal(defaultPhone,message,onSent){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal"><h3>إرسال على واتساب</h3><div class="field"><label>رقم المحضّر</label><div class="row2"><select id="waCountryCode" style="max-width:145px"><option value="20" selected>🇪🇬 +20 مصر</option></select><input id="waPhoneInput" value="${formatLocalEgyptPhone(defaultPhone)}" inputmode="numeric" maxlength="11" placeholder="010xxxxxxxx"></div><small style="display:block;color:var(--bone-dim);margin-top:6px">الرقم المحفوظ يظهر هنا تلقائياً، ويمكنك تغييره لهذا الإرسال فقط.</small></div><div class="row2"><button class="btn btn-wa" id="waSendBtn">إرسال</button><button class="btn btn-ghost" id="waCancelBtn">إلغاء</button></div></div>`;document.body.appendChild(bg);document.getElementById('waCancelBtn').onclick=()=>bg.remove();document.getElementById('waSendBtn').onclick=()=>{const localPhone=document.getElementById('waPhoneInput').value.trim();if(!isValidEgyptPhone(localPhone)){showToast('اكتب رقم مصري صحيح يبدأ بـ 01');return}const phone='20'+localPhone.replace(/^0/,'');window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,'_blank');bg.remove();if(onSent)onSent()}}
function renderNewOrder(){const rowsHtml=newOrderRows.map((row,i)=>`<div class="item-row"><select data-idx="${i}" class="row-product"><option value="">اختر الصنف</option>${products.map(p=>`<option value="${p.id}" ${row.product===p.id?'selected':''}>${p.name}</option>`).join('')}</select><input type="number" min="1" data-idx="${i}" class="row-qty" value="${row.qty}" placeholder="العدد"><button class="rm" data-idx="${i}">✕</button></div>`).join('');document.getElementById('app').innerHTML=`<div class="kicker">تسجيل طلب جديد</div><div class="card"><div class="field"><label>اسم العميل</label><input id="custName" placeholder="اسم العميل"></div><div class="field"><label>التاريخ</label><input id="orderDate" type="date" value="${todayStr()}"></div><div class="field"><label>الأصناف</label><div id="rowsWrap">${rowsHtml}</div><button class="btn btn-ghost btn-sm" id="addRowBtn">+ إضافة صنف</button></div><div class="field"><label>ملاحظات عامة (اختياري)</label><textarea id="orderNotes" rows="2" placeholder="أي ملاحظات على الطلب"></textarea></div><button class="btn btn-primary" id="submitOrderBtn">حفظ الطلب</button></div>`;document.getElementById('addRowBtn').onclick=()=>{newOrderRows.push({product:'',qty:1,note:''});renderNewOrder()};document.querySelectorAll('.rm').forEach(btn=>{btn.onclick=()=>{const idx=+btn.dataset.idx;if(newOrderRows.length>1)newOrderRows.splice(idx,1);renderNewOrder()}});document.querySelectorAll('.row-product').forEach(sel=>{sel.onchange=()=>{newOrderRows[+sel.dataset.idx].product=sel.value}});document.querySelectorAll('.row-qty').forEach(inp=>{inp.onchange=()=>{newOrderRows[+inp.dataset.idx].qty=+inp.value||1}});document.getElementById('submitOrderBtn').onclick=submitNewOrder}
function buildOrderMessage(order){let text=`طلب جديد 🧾\nالعميل: ${order.customer}\nالتاريخ: ${order.date}\nالأصناف:\n`;order.items.forEach(it=>{text+=`- ${it.name} × ${it.qty}\n`});if(order.notes)text+=`ملاحظات: ${order.notes}`;return text}
function submitNewOrder(){const customer=document.getElementById('custName').value.trim(),date=document.getElementById('orderDate').value,notes=document.getElementById('orderNotes').value.trim(),items=newOrderRows.filter(r=>r.product&&r.qty>0).map(r=>{const p=products.find(pp=>pp.id===r.product);return{productId:r.product,name:p?p.name:'صنف',qty:r.qty,picked:false}});if(!customer){showToast('اكتب اسم العميل الأول');return}if(items.length===0){showToast('ضيف صنف واحد على الأقل');return}const order={id:'ord_'+Date.now(),customer,date,notes,items,status:'pending',createdAt:Date.now()};orders.unshift(order);saveOrders();newOrderRows=[{product:'',qty:1,note:''}];renderNewOrder();showToast('اتسجل الطلب بنجاح');openWhatsAppModal(packerPhone,buildOrderMessage(order))}
function renderPacking(){if(openOrderId){renderOrderDetail(openOrderId);return}const pending=orders.filter(o=>o.status==='pending'),done=orders.filter(o=>o.status==='done').slice(0,8),pendingHtml=pending.length?pending.map(o=>`<div class="order-card" data-id="${o.id}"><div class="top"><span class="cust">${o.customer}</span><span class="badge">قيد التحضير</span></div><div class="meta">${o.items.length} صنف • ${o.date}</div></div>`).join(''):`<div class="empty">مفيش طلبات قيد التحضير دلوقتي</div>`,doneHtml=done.map(o=>`<div class="order-card" data-id="${o.id}"><div class="top"><span class="cust">${o.customer}</span><span class="badge done">تم ✓</span></div><div class="meta">${o.items.length} صنف • ${o.date}</div></div>`).join('');document.getElementById('app').innerHTML=`<div class="kicker">قيد التحضير</div>${pendingHtml}${done.length?`<div class="kicker" style="margin-top:26px;">آخر الطلبات المكتملة</div>${doneHtml}`:''}`;document.querySelectorAll('.order-card').forEach(card=>{card.onclick=()=>{openOrderId=card.dataset.id;renderPacking()}})}
function renderOrderDetail(id){const order=orders.find(o=>o.id===id);if(!order){openOrderId=null;renderPacking();return}const pickedCount=order.items.filter(i=>i.picked).length,pct=Math.round(pickedCount/order.items.length*100),rowsHtml=order.items.map((it,i)=>`<div class="check-row"><input type="checkbox" data-idx="${i}" ${it.picked?'checked':''}><div class="info"><div class="pname ${it.picked?'picked':''}">${it.name}</div></div><span class="qty-pill">× ${it.qty}</span></div>`).join('');document.getElementById('app').innerHTML=`<span class="back-link" id="backBtn">‹ رجوع للطلبات</span><div class="card"><div class="top" style="display:flex;justify-content:space-between;margin-bottom:4px;"><h2 style="font-size:1.1rem;">${order.customer}</h2><span class="badge ${order.status==='done'?'done':''}">${order.status==='done'?'تم ✓':'قيد التحضير'}</span></div><div class="meta" style="color:var(--bone-dim);font-size:.85rem;margin-bottom:14px;">${order.date}${order.notes?' • '+order.notes:''}</div><div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>${rowsHtml}${order.status==='pending'?`<button class="btn btn-ok" id="completeBtn" style="margin-top:18px;" ${pickedCount<order.items.length?'disabled':''}>تأكيد اكتمال التحضير</button>`:''}<button class="btn btn-wa" id="waResendBtn" style="margin-top:10px;">📲 إرسال على واتساب</button></div>`;document.getElementById('backBtn').onclick=()=>{openOrderId=null;renderPacking()};document.querySelectorAll('.check-row input').forEach(cb=>{cb.onchange=()=>{order.items[+cb.dataset.idx].picked=cb.checked;saveOrders();renderOrderDetail(id)}});const completeBtn=document.getElementById('completeBtn');if(completeBtn)completeBtn.onclick=()=>{if(order.items.some(i=>!i.picked)){showToast('لسه فيه أصناف ما اتلمتش');return}order.status='done';order.doneAt=Date.now();saveOrders();showToast('اتأكد تحضير الطلب');openWhatsAppModal(packerPhone,`الطلب جاهز ✅\nالعميل: ${order.customer}\nكل الأصناف اتحضرت.`,()=>{openOrderId=null;renderPacking()})};document.getElementById('waResendBtn').onclick=()=>{openWhatsAppModal(packerPhone,buildOrderMessage(order))}}
function renderCatalog(){const rows=products.map(p=>`<div class="prod-row"><span>${p.name}</span><button class="btn-danger btn-sm" data-id="${p.id}">حذف</button></div>`).join('');document.getElementById('app').innerHTML=`<div class="kicker">الأصناف المتاحة</div><div class="card">${rows||'<div class="empty">مفيش أصناف مضافة</div>'}</div><div class="card"><div class="field"><label>إضافة صنف جديد</label><input id="newProdName" placeholder="اسم الصنف"></div><button class="btn btn-primary" id="addProdBtn">إضافة</button></div>`;document.querySelectorAll('.prod-row button').forEach(btn=>{btn.onclick=()=>{products=products.filter(p=>p.id!==btn.dataset.id);saveProducts();renderCatalog()}});document.getElementById('addProdBtn').onclick=()=>{const name=document.getElementById('newProdName').value.trim();if(!name)return;products.push({id:'p_'+Date.now(),name});saveProducts();renderCatalog()}}
function render(){if(currentTab==='new')renderNewOrder();else if(currentTab==='pack')renderPacking();else if(currentTab==='catalog')renderCatalog()} if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(()=>{})})} window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});(function init(){loadAll();render()})();
</script></body></html>
