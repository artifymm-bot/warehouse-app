<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الأصيل - إدارة الطلبات</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#15110D"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#15110d;--card:#1d1712;--text:#ede6d8;--muted:#a89c89;--line:#3a322b;--a:#c6501f;--ok:#4c8b5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:IBM Plex Sans Arabic,sans-serif;padding-bottom:82px}header{padding:18px 15px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#15110df5;z-index:5}header h1{margin:0;font:800 1.05rem Cairo}header span{color:#e6712e}main{max-width:700px;margin:auto;padding:16px}.card,.order{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}.field{margin-bottom:13px}label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:5px}input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.btn{border:0;border-radius:8px;padding:11px 14px;width:100%;background:var(--a);color:white;font-weight:700;cursor:pointer}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.ok{background:var(--ok)}.wa{background:#28613e}.sm{width:auto;padding:8px 11px;font-size:.8rem}.items{overflow:auto}.item{display:grid;grid-template-columns:1.4fr .55fr .55fr .65fr 30px;gap:6px;margin-bottom:7px}.item input,.item select{padding:8px;font-size:.78rem}.x{background:none;border:0;color:var(--muted);font-size:1.1rem}.muted{color:var(--muted);font-size:.8rem}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:.7rem;color:var(--muted)}.done{color:#6bb57c;border-color:var(--ok)}.check{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px solid var(--line)}.check input{width:23px}.check .name{flex:1}.picked{text-decoration:line-through;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10}nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 2px;font-size:.7rem}nav button.active{color:#e6712e}nav b{display:block;font-size:1.15rem}.invoice{display:none}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modal>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;width:min(430px,100%)}table{width:100%;border-collapse:collapse;font-size:.76rem}th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}@media print{body>*{display:none!important}.invoice{display:block!important;color:#111;background:#fff;padding:20px}.invoice table{color:#111}.invoice th,.invoice td{border-color:#ddd}}</style></head><body><header><h1>الأصيل <span>•</span> إدارة الطلبات</h1></header><main id="app"></main><nav><button data-t="new" class="active">📝<br>طلب جديد</button><button data-t="pending">📦<br>التحضير</button><button data-t="done">✅<br>المحضّرة</button><button data-t="people">👥<br>المحفوظون</button><button data-t="products">🏷️<br>الأصناف</button></nav><script>
const D=[{id:'p1',name:'مبخرة 3-4'},{id:'p2',name:'مبخرة كريستال'},{id:'p3',name:'دخون كمبودي'},{id:'p4',name:'عود معطر درجة أولى'},{id:'p5',name:'بخور مستكة'},{id:'p6',name:'دهن عود ملكي'}];let products=get('products',D),orders=get('orders',[]),customers=get('customers',[]),packers=get('packers',[]),tab='new',oid=null,rows=[{product:'',qty:1,bonus:0,unit:'قطعة'}];function get(k,d){try{return JSON.parse(localStorage.getItem('mk_'+k))??d}catch{return d}}function put(){localStorage.setItem('mk_products',JSON.stringify(products));localStorage.setItem('mk_orders',JSON.stringify(orders));localStorage.setItem('mk_customers',JSON.stringify(customers));localStorage.setItem('mk_packers',JSON.stringify(packers))}function toast(x){alert(x)}function nav(t){tab=t;oid=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.t));function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function wa(p,m){p=p.replace(/\D/g,'');if(p.startsWith('01'))p='20'+p.slice(1);window.open('https://wa.me/'+p+'?text='+encodeURIComponent(m),'_blank')}function date(){return new Date().toISOString().slice(0,10)}
function newView(){let h=rows.map((r,i)=>`<div class="item"><select class="p" data-i="${i}"><option value="">الصنف</option>${products.map(p=>`<option value="${p.id}" ${r.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="q" data-i="${i}" type="number" min="1" value="${r.qty}" placeholder="كمية"><input class="b" data-i="${i}" type="number" min="0" value="${r.bonus}" placeholder="بونص"><select class="u" data-i="${i}"><option ${r.unit==='قطعة'?'selected':''}>قطعة</option><option ${r.unit==='كرتونة'?'selected':''}>كرتونة</option></select><button class="x" data-i="${i}">×</button></div>`).join('');document.getElementById('app').innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">طلبية جديدة</h2><div class="field"><label>اسم المرسل إليه</label><input id="cn" list="cl" placeholder="اسم العميل"><datalist id="cl">${customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div class="field"><label>رقم المرسل إليه</label><input id="cp" inputmode="numeric" placeholder="01xxxxxxxxx"></div><div class="field"><label>الأصناف — بدون أسعار</label><div class="muted">الكمية | بونص | الوحدة</div><div class="items">${h}</div><button id="add" class="btn ghost sm">+ إضافة صنف</button></div><div class="field"><label>المُحضّر</label><select id="pk"><option value="">اختيار المُحضّر</option>${packers.map(p=>`<option value="${p.id}">${esc(p.name)} • ${esc(p.phone)}</option>`).join('')}</select></div><div class="field"><label>ملاحظات</label><textarea id="no" rows="2"></textarea></div><button id="create" class="btn">📦 إنشاء وإرسال الطلبية</button></div>`;document.getElementById('cn').onchange=()=>{let c=customers.find(x=>x.name===document.getElementById('cn').value);if(c)document.getElementById('cp').value=c.phone};document.getElementById('add').onclick=()=>{rows.push({product:'',qty:1,bonus:0,unit:'قطعة'});newView()};document.querySelectorAll('.p').forEach(e=>e.onchange=()=>rows[e.dataset.i].product=e.value);document.querySelectorAll('.q').forEach(e=>e.oninput=()=>rows[e.dataset.i].qty=+e.value||1);document.querySelectorAll('.b').forEach(e=>e.oninput=()=>rows[e.dataset.i].bonus=+e.value||0);document.querySelectorAll('.u').forEach(e=>e.onchange=()=>rows[e.dataset.i].unit=e.value);document.querySelectorAll('.x').forEach(e=>e.onclick=()=>{if(rows.length>1){rows.splice(+e.dataset.i,1);newView()}});document.getElementById('create').onclick=create}
function create(){let name=document.getElementById('cn').value.trim(),phone=document.getElementById('cp').value.replace(/\D/g,''),pk=document.getElementById('pk').value,items=rows.filter(r=>r.product).map(r=>{let p=products.find(x=>x.id===r.product);return{...r,name:p.name,picked:false,price:0}});if(!name||!phone||!pk||!items.length)return toast('أكمل بيانات العميل والمُحضّر والأصناف');let c=customers.find(x=>x.phone===phone);if(!c)customers.push({id:'c'+Date.now(),name,phone});let p=packers.find(x=>x.id===pk),o={id:'o'+Date.now(),number:String(Date.now()).slice(-6),customer:name,phone,date:date(),notes:document.getElementById('no').value.trim(),items,packerId:pk,packerName:p.name,status:'sent',createdAt:Date.now()};orders.unshift(o);put();wa(p.phone,`طلبية تحضير #${o.number}\nالمرسل إليه: ${o.customer}\n${items.map(x=>`• ${x.name} — ${x.qty} ${x.unit}${x.bonus?' + بونص '+x.bonus:''}`).join('\n')}${o.notes?'\nملاحظات: '+o.notes:''}\n\nبعد الانتهاء اضغط تم التحضير ✅`);rows=[{product:'',qty:1,bonus:0,unit:'قطعة'}];nav('pending')}
function list(done){let a=orders.filter(o=>done?o.status==='done':o.status!=='done');document.getElementById('app').innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">${done?'سجل الطلبات المحضّرة':'طلبات التحضير'}</h2>${a.length?a.map(o=>`<div class="order" data-id="${o.id}"><div class="top"><b>${esc(o.customer)}</b><span class="badge ${done?'done':''}">${done?'تم التحضير ✓':'قيد التحضير'}</span></div><div class="muted">#${o.number} • ${o.date} • ${o.items.length} صنف</div></div>`).join(''):'<div class="muted" style="padding:25px;text-align:center">لا توجد طلبات</div>'}</div>`;document.querySelectorAll('.order').forEach(e=>e.onclick=()=>detail(e.dataset.id,done))}
function detail(id,done){let o=orders.find(x=>x.id===id);document.getElementById('app').innerHTML=`<div class="card"><div class="top"><h2 style="font:800 1rem Cairo">${esc(o.customer)}</h2><span class="badge ${o.status==='done'?'done':''}">${o.status==='done'?'تم التحضير ✓':'قيد التحضير'}</span></div><div class="muted">#${o.number} • ${o.date}<br>المُحضّر: ${esc(o.packerName)}<br>رقم العميل: ${esc(o.phone)}</div>${o.items.map((x,i)=>`<div class="check"><input type="checkbox" data-i="${i}" ${x.picked?'checked':''}><span class="name ${x.picked?'picked':''}">${esc(x.name)}</span><span class="badge">${x.qty} ${x.unit}${x.bonus?' + بونص '+x.bonus:''}</span></div>`).join('')}${o.status!=='done'?'<button id="done" class="btn ok" style="margin-top:14px">✅ تم التحضير</button>':'<button id="inv" class="btn" style="margin-top:14px">🧾 تحويل إلى فاتورة</button>'}<button id="back" class="btn ghost" style="margin-top:8px">‹ رجوع</button></div>`;document.querySelectorAll('.check input').forEach(e=>e.onchange=()=>{o.items[+e.dataset.i].picked=e.checked;put()});let d=document.getElementById('done');if(d)d.onclick=()=>{o.items.forEach(x=>x.picked=true);o.status='done';o.doneAt=Date.now();put();toast('تم التحضير ✓');nav('done')};let inv=document.getElementById('inv');if(inv)inv.onclick=()=>invoice(o);document.getElementById('back').onclick=()=>nav(done?'done':'pending')}
function invoice(o){document.getElementById('app').innerHTML=`<div class="card"><div style="text-align:center"><h2 style="font:800 1rem Cairo">الأصيل لاستيراد الفوحات والمباخر</h2><div class="muted">المنصورة – الدقهلية – مصر</div></div><hr style="border-color:var(--line)"><div class="muted">المرسل إليه: <b>${esc(o.customer)}</b><br>الهاتف: ${esc(o.phone)}<br>رقم الفاتورة: #${o.number} • ${o.date}</div><table><thead><tr><th>الصنف</th><th>كمية</th><th>بونص</th><th>الوحدة</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${o.items.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${x.bonus}</td><td>${x.unit}</td><td><input class="price" data-i="${i}" type="number" min="0" value="${x.price||''}"></td><td id="l${i}">0</td></tr>`).join('')}</tbody></table><h3>الإجمالي: <span id="tot">0</span> جنيه</h3><button id="pdf" class="btn">📄 إنشاء PDF</button><button id="send" class="btn wa" style="margin-top:8px">📲 إرسال للعميل</button></div>`;function calc(){let t=0;o.items.forEach((x,i)=>{x.price=+document.querySelector('.price[data-i="'+i+'"]').value||0;let v=x.qty*x.price;t+=v;document.getElementById('l'+i).textContent=v.toFixed(2)});o.invoiceTotal=t;put();document.getElementById('tot').textContent=t.toFixed(2)}document.querySelectorAll('.price').forEach(e=>e.oninput=calc);calc();document.getElementById('pdf').onclick=()=>{calc();printInv(o)};document.getElementById('send').onclick=()=>{calc();wa(o.phone,`فاتورة الأصيل لاستيراد الفوحات والمباخر\nرقم الفاتورة #${o.number}\nالإجمالي: ${o.invoiceTotal.toFixed(2)} جنيه`)}}
function printInv(o){let x=document.createElement('div');x.className='invoice';x.innerHTML=`<h2>الأصيل لاستيراد الفوحات والمباخر</h2><p>المنصورة – الدقهلية – مصر</p><p>المرسل إليه: ${esc(o.customer)}<br>الهاتف: ${esc(o.phone)}<br>رقم الفاتورة: #${o.number}<br>التاريخ: ${o.date}</p><table><tr><th>الصنف</th><th>كمية</th><th>بونص</th><th>الوحدة</th><th>السعر</th><th>الإجمالي</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${i.bonus}</td><td>${i.unit}</td><td>${i.price}</td><td>${(i.qty*i.price).toFixed(2)}</td></tr>`).join('')}</table><h3>الإجمالي: ${o.invoiceTotal.toFixed(2)} جنيه</h3>`;document.body.append(x);window.print();setTimeout(()=>x.remove(),500)}
function people(){document.getElementById('app').innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">المُحضّرون المحفوظون</h2>${packers.map(p=>`<div class="top" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(p.name)}<br><span class="muted">${esc(p.phone)}</span></span><button class="btn danger sm" data-p="${p.id}">حذف</button></div>`).join('')}<div class="field" style="margin-top:12px"><input id="pn" placeholder="اسم المُحضّر"></div><div class="field"><input id="pp" placeholder="01xxxxxxxxx"></div><button id="ap" class="btn">+ حفظ مُحضّر</button></div><div class="card"><h2 style="font:800 1rem Cairo">العملاء المحفوظون</h2>${customers.map(c=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${esc(c.name)}<br><span class="muted">${esc(c.phone)}</span></div>`).join('')}</div>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{packers=packers.filter(x=>x.id!==b.dataset.p);put();people()});document.getElementById('ap').onclick=()=>{let n=document.getElementById('pn').value.trim(),p=document.getElementById('pp').value.replace(/\D/g,'');if(n&&p){packers.push({id:'pk'+Date.now(),name:n,phone:p});put();people()}}}
function productsView(){document.getElementById('app').innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">الأصناف</h2>${products.map(p=>`<div class="top" style="padding:8px 0;border-bottom:1px solid var(--line)">${esc(p.name)}<button class="btn danger sm" data-id="${p.id}">حذف</button></div>`).join('')}<input id="newp" placeholder="اسم صنف جديد" style="margin-top:12px"><button id="addp" class="btn" style="margin-top:8px">إضافة</button></div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{products=products.filter(p=>p.id!==b.dataset.id);put();productsView()});document.getElementById('addp').onclick=()=>{let n=document.getElementById('newp').value.trim();if(n){products.push({id:'p'+Date.now(),name:n});put();productsView()}}}function render(){if(tab==='new')newView();else if(tab==='pending')list(false);else if(tab==='done')list(true);else if(tab==='people')people();else productsView()}render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
