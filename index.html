<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15110d"><title>الأصيل - عروض الأسعار والطلبات</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>:root{--bg:#15110d;--card:#1d1712;--text:#ede6d8;--muted:#a89c89;--line:#3a322b;--a:#c6501f;--ok:#4c8b5b;--blue:#315f88;--warn:#8b682b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:IBM Plex Sans Arabic,sans-serif;padding-bottom:78px}header{padding:15px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#15110df5;z-index:5}header h1{margin:0;font:800 1.05rem Cairo}header span{color:#e6712e}main{max-width:720px;margin:auto;padding:14px}.card,.order{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}.field{margin-bottom:13px}label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:5px}input,select,textarea{width:100%;background:#211a15;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.btn{border:0;border-radius:8px;padding:11px 14px;width:100%;background:var(--a);color:#fff;font-weight:700}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.ok{background:var(--ok)}.blue{background:var(--blue)}.muted{color:var(--muted);font-size:.8rem}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:.7rem;color:var(--muted)}.items{overflow:auto}.item{display:grid;grid-template-columns:1.3fr .5fr .65fr .65fr 28px;gap:6px;margin-bottom:7px}.item input,.item select{padding:8px;font-size:.76rem}.x{background:none;border:0;color:var(--muted);font-size:1.1rem}.summary{background:#241c16;border:1px solid var(--line);border-radius:10px;padding:12px}.summary div{display:flex;justify-content:space-between;padding:4px 0}.summary .net{font-size:1.1rem;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}.alert{background:#51351b;border:1px solid #9b6a32;border-radius:10px;padding:11px;margin-bottom:12px}.okmsg{background:#173c25;border:1px solid #4c8b5b;border-radius:10px;padding:11px;margin-bottom:12px}.checkrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.checkrow input{width:23px}.login{min-height:75vh;display:flex;align-items:center;justify-content:center}.login .card{width:min(430px,100%);text-align:center}.status{position:fixed;top:7px;left:8px;font-size:.65rem;color:#6bb57c;z-index:20}.empty{text-align:center;padding:20px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10}nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px;font-size:.65rem}nav button.active{color:#e6712e}.hidden{display:none!important}.quote-print{display:none}@media(max-width:430px){.item{grid-template-columns:1.1fr .45fr .6fr .6fr 24px}.item input,.item select{font-size:.7rem;padding:7px}}@media print{body>*{display:none!important}.quote-print{display:block!important;color:#111;background:#fff;padding:24px;font-family:Arial,sans-serif}.quote-print table{width:100%;border-collapse:collapse;color:#111}.quote-print th,.quote-print td{border:1px solid #ccc;padding:8px;text-align:right}}
</style></head><body><div class="status" id="status">اتصال...</div><header><h1>الأصيل <span>•</span> عروض الأسعار والطلبات</h1></header><main id="app"></main><div id="printArea" class="quote-print"></div><nav id="nav" class="hidden"></nav><script>
const firebaseConfig={apiKey:'AIzaSyCKW9_6dZXJony37x9Ly6-rWpb1WZF7XVg',authDomain:'aseel-warehouse.firebaseapp.com',projectId:'aseel-warehouse',storageBucket:'aseel-warehouse.firebasestorage.app',messagingSenderId:'533394002034',appId:'1:533394002034:web:cc308c30a25cdceadaf2eb'};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const D=[{id:'p1',name:'مبخرة 3-4'},{id:'p2',name:'مبخرة كريستال'},{id:'p3',name:'دخون كمبودي'},{id:'p4',name:'عود معطر درجة أولى'},{id:'p5',name:'بخور مستكة'},{id:'p6',name:'دهن عود ملكي'}];let products=[],orders=[],customers=[],packers=[],role=localStorage.getItem('aseel_role')||'',packerId=localStorage.getItem('aseel_packer')||'',tab='quotes',rows=[blank()],unsubs=[],lastAlert=Number(localStorage.getItem('aseel_last_alert')||0);const app=document.getElementById('app'),navEl=document.getElementById('nav');
function blank(){return{product:'',qty:1,bonus:0,unit:'قطعة',price:0}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(x){alert(x)}function today(){return new Date().toISOString().slice(0,10)}function money(x){return Number(x||0).toFixed(2)}function wa(p,m){p=String(p||'').replace(/\D/g,'');if(p.startsWith('01'))p='20'+p.slice(1);if(p)window.open('https://wa.me/'+p+'?text='+encodeURIComponent(m),'_blank')}function setStatus(x){document.getElementById('status').textContent=x}
async function boot(){try{await firebase.auth().signInAnonymously();setStatus('متصل ✓');subscribe();if(!role)roleView();else{buildNav();render()}}catch(e){setStatus('خطأ في الاتصال');app.innerHTML='<div class="card"><b>تعذر الاتصال بقاعدة البيانات</b><p class="muted">'+esc(e.message)+'</p></div>'}}function subscribe(){unsubs.forEach(f=>f());unsubs=[];['products','orders','customers','packers'].forEach(col=>{const u=db.collection(col).onSnapshot(s=>{const a=s.docs.map(d=>({id:d.id,...d.data()}));if(col==='products')products=a.length?a:D;else if(col==='orders')orders=a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));else if(col==='customers')customers=a;else packers=a;if(role){render();managerAlerts()}},e=>{console.error(col,e);setStatus('مشكلة في '+col+': '+e.message)});unsubs.push(u)})}
function roleView(){navEl.classList.add('hidden');app.innerHTML='<div class="login"><div class="card"><h2 style="font:800 1.1rem Cairo">اختيار الجهاز</h2><p class="muted">اختر وظيفة هذا الهاتف.</p><button class="btn" id="m">📱 جوال المدير</button><button class="btn ghost" id="p" style="margin-top:9px">📦 جوال المُحضّر</button><button class="btn ghost" id="r" style="margin-top:9px">🔎 جوال المراجع</button></div></div>';m.onclick=()=>setRole('manager');p.onclick=()=>choosePacker('preparer');r.onclick=()=>setRole('reviewer')}
function setRole(r){role=r;localStorage.setItem('aseel_role',r);nav='';buildNav();render()}function choosePacker(r){const list=packers.filter(x=>x.active!==false);app.innerHTML='<div class="login"><div class="card"><h2 style="font:800 1.1rem Cairo">اختر المُحضّر</h2>'+ (list.length?list.map(p=>`<button class="btn ghost pk" data-id="${p.id}" style="margin-top:8px">${esc(p.name)}<br><span class="muted">${esc(p.phone)}</span></button>`).join(''):'<p class="muted">لا يوجد مُحضّرون محفوظون.</p>')+'<button class="btn" id="back" style="margin-top:12px">رجوع</button></div></div>';document.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{role=r;packerId=b.dataset.id;localStorage.setItem('aseel_role',r);localStorage.setItem('aseel_packer',packerId);buildNav();render()});back.onclick=roleView}
function buildNav(){navEl.classList.remove('hidden');const buttons=role==='manager'?[['quotes','💰','عروض الأسعار'],['prep','📦','التحضير'],['done','🔔','المراجعة'],['new','➕','عرض جديد'],['people','👥','البيانات']]:role==='preparer'?[['prep','📦','طلبات التحضير']]:[['review','🔎','مراجعة الطلبات']];navEl.innerHTML=buttons.map(x=>`<button data-t="${x[0]}">${x[1]}<br>${x[2]}</button>`).join('');navEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;navEl.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()})}
function render(){if(role==='manager'){if(tab==='new')newView();else if(tab==='prep')prepList();else if(tab==='done')doneList();else if(tab==='people')people();else quoteList()}else if(role==='preparer')prepList();else reviewList()}
function customerFields(){return `<div class="field"><label>اسم العميل</label><input id="cn" list="cl" placeholder="اسم العميل"><datalist id="cl">${customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div class="field"><label>رقم العميل</label><input id="cp" inputmode="numeric" placeholder="01xxxxxxxxx"></div>`}
function newView(){let h=rows.map((r,i)=>`<div class="item"><select class="p" data-i="${i}"><option value="">الصنف</option>${products.map(p=>`<option value="${p.id}" ${r.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="q" data-i="${i}" type="number" min="1" value="${r.qty}"><input class="pr" data-i="${i}" type="number" min="0" step="0.01" value="${r.price}" placeholder="السعر"><input class="b" data-i="${i}" type="number" min="0" value="${r.bonus}" placeholder="بونص"><button class="x" data-i="${i}">×</button></div>`).join('');app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">عمل عرض سعر</h2>${customerFields()}<div class="field"><label>الأصناف — الكمية | السعر | البونص</label><div class="items">${h}</div><button id="add" class="btn ghost">+ إضافة صنف</button></div><div class="field"><label>خصم على كامل المبلغ (%)</label><input id="disc" type="number" min="0" max="100" step="0.01" value="0"></div><div class="field"><label>ملاحظات</label><textarea id="no" rows="2"></textarea></div><div id="calc" class="summary"></div><button id="save" class="btn">💰 حفظ وعمل عرض سعر</button></div>`;bindNew();calcQuote()}
function bindNew(){cn.onchange=()=>{const c=customers.find(x=>x.name===cn.value);if(c)cp.value=c.phone};add.onclick=()=>{rows.push(blank());newView()};document.querySelectorAll('.p').forEach(e=>e.onchange=()=>{rows[e.dataset.i].product=e.value;calcQuote()});document.querySelectorAll('.q').forEach(e=>e.oninput=()=>{rows[e.dataset.i].qty=Number(e.value)||1;calcQuote()});document.querySelectorAll('.pr').forEach(e=>e.oninput=()=>{rows[e.dataset.i].price=Number(e.value)||0;calcQuote()});document.querySelectorAll('.b').forEach(e=>e.oninput=()=>rows[e.dataset.i].bonus=Number(e.value)||0);disc.oninput=calcQuote;document.querySelectorAll('.x').forEach(e=>e.onclick=()=>{if(rows.length>1){rows.splice(Number(e.dataset.i),1);newView()}});save.onclick=makeQuote}
function calc(){const subtotal=rows.filter(r=>r.product).reduce((s,r)=>s+r.qty*r.price,0),dp=Math.min(100,Math.max(0,Number(disc?.value)||0));return{subtotal,dp,discount:subtotal*dp/100,total:subtotal-(subtotal*dp/100)}}function calcQuote(){const x=calc();if(document.getElementById('calc'))calc.innerHTML=`<div><span>قبل الخصم</span><b>${money(x.subtotal)}</b></div><div><span>الخصم (${x.dp}%)</span><b>${money(x.discount)}</b></div><div class="net"><span>الصافي</span><b>${money(x.total)}</b></div>`}
async function saveCustomer(name,phone){const c=customers.find(x=>x.phone===phone);if(c){if(c.name!==name)await db.collection('customers').doc(c.id).update({name,updatedAt:Date.now()})}else await db.collection('customers').add({name,phone,createdAt:Date.now()})}
async function makeQuote(){const name=cn.value.trim(),phone=cp.value.replace(/\D/g,''),items=rows.filter(r=>r.product).map(r=>{const p=products.find(x=>x.id===r.product);return{product:r.product,name:p?.name||'',qty:Number(r.qty)||1,bonus:Number(r.bonus)||0,unit:r.unit,price:Number(r.price)||0,picked:false}}),x=calc();if(!name||!phone||!items.length)return toast('أكمل العميل والأصناف والأسعار');try{await saveCustomer(name,phone);const o={number:String(Date.now()).slice(-6),customer:name,phone,date:today(),notes:no.value.trim(),items,discountPercent:x.dp,subtotal:x.subtotal,discount:x.discount,total:x.total,status:'quote',createdAt:Date.now(),updatedAt:Date.now()};const ref=await db.collection('orders').add(o);rows=[blank()];toast('تم حفظ عرض السعر ومزامنته ✓');showQuote(ref.id)}catch(e){toast('تعذر الحفظ: '+e.message)}}
function quoteList(){const a=orders.filter(o=>['quote','preparing','review','done','invoiced'].includes(o.status));app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">عروض الأسعار</h2><p class="muted">المُحضّر لا يتم اختياره هنا. بعد موافقة العميل اختر العرض ثم حدد المُحضّر.</p>${a.length?a.map(o=>`<div class="order"><div class="top"><b>${esc(o.customer)}</b><span class="badge">${statusText(o.status)}</span></div><div class="muted">#${o.number} • ${o.date}</div><div class="summary" style="margin-top:9px"><div><span>قبل الخصم</span><b>${money(o.subtotal)}</b></div><div><span>الخصم</span><b>${money(o.discount)} (${Number(o.discountPercent||0)}%)</b></div><div class="net"><span>الصافي</span><b>${money(o.total)}</b></div></div><button class="btn ghost" style="margin-top:9px" onclick="showQuote('${o.id}')">فتح العرض</button>${o.status==='quote'?`<button class="btn ok" style="margin-top:7px" onclick="choosePackerForOrder('${o.id}')">✅ العميل وافق — اختيار المُحضّر</button>`:''}${o.status==='done'?`<button class="btn" style="margin-top:7px" onclick="invoice('${o.id}')">🧾 إصدار فاتورة</button>`:''}</div>`).join(''):'<div class="empty">لا توجد عروض أسعار.</div>'}</div>`}
function choosePackerForOrder(id){const o=orders.find(x=>x.id===id),list=packers.filter(x=>x.active!==false);if(!o)return;app.innerHTML=`<div class="card"><h2>اختيار مُحضّر للطلبية #${esc(o.number)}</h2><p>العميل: <b>${esc(o.customer)}</b></p><p class="muted">بعد الاختيار ستتحول مباشرة إلى طلبية تحضير.</p>${list.length?list.map(p=>`<button class="btn ghost" style="margin-top:8px" onclick="assignPacker('${id}','${p.id}')">${esc(p.name)}<br><span class="muted">${esc(p.phone)}</span></button>`).join(''):'<div class="empty">لا يوجد مُحضّرون نشطون. أضفهم من لوحة التحكم.</div>'}<button class="btn" style="margin-top:12px" onclick="navTo('quotes')">رجوع</button></div>`}
async function assignPacker(id,pid){const p=packers.find(x=>x.id===pid);if(!p)return;try{await db.collection('orders').doc(id).update({packerId:pid,packerName:p.name,status:'preparing',preparationDate:today(),approvedAt:Date.now(),updatedAt:Date.now()});toast('تم اختيار المُحضّر وتحويل الطلبية للتحضير ✓');navTo('quotes')}catch(e){toast('فشل التحويل: '+e.message)}}
function navTo(t){tab=t;buildNav();render()}
function prepList(){let a=orders.filter(o=>o.status==='preparing');if(role==='preparer')a=a.filter(o=>o.packerId===packerId);app.innerHTML=`<div class="card"><h2>${role==='preparer'?'طلبات التحضير':'الطلبات قيد التحضير'}</h2>${a.length?a.map(o=>`<div class="order"><div class="top"><b>${esc(o.customer)}</b><span class="badge">قيد التحضير</span></div><div class="muted">#${o.number} • تاريخ التحضير: ${esc(o.preparationDate||o.date)}</div>${o.items.map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(x.name)}</b><div class="muted">الكمية: ${x.qty} ${esc(x.unit)}${x.bonus?' • بونص: '+x.bonus:''}</div></div>`).join('')}${role==='preparer'?`<button class="btn ok" style="margin-top:10px" onclick="finishPrep('${o.id}')">✅ تم التحضير وإرسال للمراجعة</button>`:''}</div>`).join(''):'<div class="empty">لا توجد طلبات تحضير.</div>'}</div>`}
async function finishPrep(id){try{await db.collection('orders').doc(id).update({status:'review',preparedAt:Date.now(),updatedAt:Date.now()});toast('تم تسجيل التحضير وإرساله للمراجعة ✓')}catch(e){toast('فشل التسجيل: '+e.message)}}
function reviewList(){const a=orders.filter(o=>o.status==='review');app.innerHTML=`<div class="card"><h2>مراجعة الطلبات</h2><p class="muted">راجع الكميات الفعلية وتأكد أن الطلبية خرجت بالكامل وبالأعداد الصحيحة قبل اعتمادها.</p>${a.length?a.map(o=>`<div class="order"><div class="top"><b>${esc(o.customer)}</b><span class="badge">في انتظار المراجعة</span></div><div class="muted">#${o.number} • المُحضّر: ${esc(o.packerName||'')}</div>${o.items.map((x,i)=>`<div class="checkrow"><input type="checkbox" id="rv_${o.id}_${i}"><span style="flex:1"><b>${esc(x.name)}</b><br><span class="muted">المطلوب: ${x.qty} ${esc(x.unit)}${x.bonus?' + بونص '+x.bonus:''}</span></span></div>`).join('')}<button class="btn ok" style="margin-top:10px" onclick="reviewOrder('${o.id}')">🔎 اعتماد الطلبية بعد المراجعة</button></div>`).join(''):'<div class="empty">لا توجد طلبيات تنتظر المراجعة.</div>'}</div>`}
async function reviewOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const ok=o.items.every((x,i)=>document.getElementById(`rv_${id}_${i}`)?.checked);if(!ok)return toast('يجب مراجعة وتأكيد كل الأصناف قبل الاعتماد');try{await db.collection('orders').doc(id).update({status:'done',reviewedAt:Date.now(),updatedAt:Date.now()});toast('تم اعتماد الطلبية بعد المراجعة ✓')}catch(e){toast('فشل الاعتماد: '+e.message)}}
function doneList(){const a=orders.filter(o=>o.status==='done'||o.status==='invoiced');app.innerHTML=`<div class="card"><h2>المراجعة والفواتير</h2>${a.length?a.map(o=>`<div class="order"><div class="top"><b>${esc(o.customer)}</b><span class="badge">${statusText(o.status)}</span></div><div class="muted">#${o.number} • ${o.date}</div><button class="btn" style="margin-top:9px" onclick="showQuote('${o.id}')">فتح البيانات</button>${o.status==='done'?`<button class="btn ok" style="margin-top:7px" onclick="invoice('${o.id}')">🧾 إصدار فاتورة</button>`:''}</div>`).join(''):'<div class="empty">لا توجد طلبات مراجعة مكتملة.</div>'}</div>`}
function showQuote(id){const o=orders.find(x=>x.id===id);if(!o)return;app.innerHTML=`<div class="card"><h2>عرض سعر #${esc(o.number)}</h2><p class="muted">العميل: ${esc(o.customer)} • ${esc(o.phone)} • ${esc(o.date)}</p>${o.items.map(x=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0"><span>${esc(x.name)}<br><small class="muted">${x.qty} ${esc(x.unit)}${x.bonus?' + بونص '+x.bonus:''}</small></span><b>${money(x.qty*x.price)}</b></div>`).join('')}<div class="summary" style="margin-top:10px"><div><span>قبل الخصم</span><b>${money(o.subtotal)}</b></div><div><span>الخصم (${Number(o.discountPercent||0)}%)</span><b>${money(o.discount)}</b></div><div class="net"><span>الصافي</span><b>${money(o.total)}</b></div></div><button class="btn blue" style="margin-top:10px" onclick="printQuote('${o.id}')">📄 تصدير / حفظ PDF</button><button class="btn" style="margin-top:7px" onclick="sendQuoteWA('${o.id}')">📲 إرسال للعميل واتساب</button>${o.status==='quote'?`<button class="btn ok" style="margin-top:7px" onclick="choosePackerForOrder('${o.id}')">✅ العميل وافق — اختيار المُحضّر</button>`:''}${o.status==='done'?`<button class="btn" style="margin-top:7px" onclick="invoice('${o.id}')">🧾 إصدار فاتورة</button>`:''}</div>`}
function printQuote(id){const o=orders.find(x=>x.id===id);if(!o)return;printArea.innerHTML=`<h1>شركة الأصيل</h1><h2>عرض سعر #${esc(o.number)}</h2><p>العميل: ${esc(o.customer)}<br>الهاتف: ${esc(o.phone)}<br>التاريخ: ${esc(o.date)}</p><table><tr><th>الصنف</th><th>الكمية</th><th>البونص</th><th>السعر</th><th>الإجمالي</th></tr>${o.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${x.bonus||0}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</table><h3>قبل الخصم: ${money(o.subtotal)}<br>خصم ${Number(o.discountPercent||0)}%: ${money(o.discount)}<br>الصافي: ${money(o.total)}</h3>`;setTimeout(()=>window.print(),50)}
function sendQuoteWA(id){const o=orders.find(x=>x.id===id);if(!o)return;wa(o.phone,`عرض سعر #${o.number}\nالعميل: ${o.customer}\n${o.items.map(x=>`• ${x.name} — ${x.qty} ${x.unit} × ${money(x.price)}`).join('\n')}\nقبل الخصم: ${money(o.subtotal)}\nالخصم: ${Number(o.discountPercent||0)}% = ${money(o.discount)}\nالصافي: ${money(o.total)}\n\nللموافقة يرجى الرد بالموافقة.`)}
function invoice(id){const o=orders.find(x=>x.id===id);if(!o)return;const html=`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فاتورة #${esc(o.number)}</title><style>body{font-family:Arial;padding:30px;color:#111}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ccc;padding:9px;text-align:right}.total{font-size:20px;font-weight:bold;margin-top:20px}</style></head><body><h1>شركة الأصيل</h1><h2>فاتورة #${esc(o.number)}</h2><p>العميل: ${esc(o.customer)}<br>الهاتف: ${esc(o.phone)}<br>التاريخ: ${esc(o.date)}</p><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${o.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</table><div class="total">قبل الخصم: ${money(o.subtotal)}<br>الخصم: ${Number(o.discountPercent||0)}% — ${money(o.discount)}<br>الصافي: ${money(o.total)}</div><script>window.onload=()=>window.print()<\/script></body></html>`;db.collection('orders').doc(id).update({status:'invoiced',invoicedAt:Date.now(),updatedAt:Date.now()}).catch(e=>toast('تعذر تحديث حالة الفاتورة: '+e.message));const w=window.open('','_blank');w.document.write(html);w.document.close()}
function people(){app.innerHTML='<div class="card"><h2>البيانات</h2><h3>المُحضّرون</h3>'+packers.map(p=>`<p>${esc(p.name)} — ${esc(p.phone)}</p>`).join('')+'<h3>العملاء</h3>'+customers.map(c=>`<p>${esc(c.name)} — ${esc(c.phone)}</p>`).join('')+'</div>'}
function statusText(s){return s==='quote'?'عرض سعر':s==='preparing'?'قيد التحضير':s==='review'?'في انتظار المراجعة':s==='done'?'تمت المراجعة':s==='invoiced'?'تم إصدار الفاتورة':s}
function managerAlerts(){if(role!=='manager')return;const o=orders.find(x=>x.status==='review'&&x.preparedAt>lastAlert);if(o){lastAlert=o.preparedAt;localStorage.setItem('aseel_last_alert',lastAlert);if(!document.querySelector('.alert')){const d=document.createElement('div');d.className='alert';d.innerHTML=`🔔 تم تحضير طلبية العميل <b>${esc(o.customer)}</b> بواسطة ${esc(o.packerName||'المُحضّر')} وهي الآن في انتظار المراجعة.`;app.prepend(d)}}}
boot();
</script></body></html>
