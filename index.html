<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15110d"><title>الأصيل - عروض الأسعار والطلبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#15110d;--card:#1d1712;--text:#ede6d8;--muted:#a89c89;--line:#3a322b;--a:#c6501f;--ok:#4c8b5b;--danger:#9c3d35;--blue:#315f88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:IBM Plex Sans Arabic,sans-serif;padding-bottom:78px}header{padding:15px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#15110df5;z-index:5}header h1{margin:0;font:800 1.05rem Cairo}header span{color:#e6712e}main{max-width:720px;margin:auto;padding:14px}.card,.order{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}.field{margin-bottom:13px}label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:5px}input,select,textarea{width:100%;background:#211a15;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.btn{border:0;border-radius:8px;padding:11px 14px;width:100%;background:var(--a);color:#fff;font-weight:700;cursor:pointer}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.ok{background:var(--ok)}.blue{background:var(--blue)}.danger{background:var(--danger)}.wa{background:#28613e}.sm{width:auto;padding:8px 11px;font-size:.8rem}.muted{color:var(--muted);font-size:.8rem}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:.7rem;color:var(--muted);white-space:nowrap}.done{color:#6bb57c;border-color:var(--ok)}.items{overflow:auto}.item{display:grid;grid-template-columns:1.25fr .5fr .65fr .65fr 28px;gap:6px;margin-bottom:7px}.item input,.item select{padding:8px;font-size:.76rem}.x{background:none;border:0;color:var(--muted);font-size:1.1rem}.summary{background:#241c16;border:1px solid var(--line);border-radius:10px;padding:12px}.summary div{display:flex;justify-content:space-between;padding:4px 0}.summary .net{font-size:1.1rem;font-weight:800;color:#fff;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10}nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px;font-size:.66rem}nav button.active{color:#e6712e}.hidden{display:none!important}.login{min-height:75vh;display:flex;align-items:center;justify-content:center}.login .card{width:min(430px,100%);text-align:center}.status{position:fixed;top:7px;left:8px;font-size:.65rem;color:#6bb57c;z-index:20}.alert{background:#51351b;border:1px solid #9b6a32;border-radius:10px;padding:11px;margin-bottom:12px}.okmsg{background:#173c25;border:1px solid #4c8b5b;border-radius:10px;padding:11px;margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:.75rem}th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}.quote-print{display:none}.price-total{font-weight:800}.empty{text-align:center;padding:20px;color:var(--muted)}
@media(max-width:430px){.item{grid-template-columns:1.1fr .45fr .6fr .6fr 24px}.item input,.item select{font-size:.7rem;padding:7px}}
@media print{body>*{display:none!important}.quote-print{display:block!important;color:#111;background:#fff;padding:24px;font-family:Arial,sans-serif}.quote-print table{color:#111}.quote-print th,.quote-print td{border-color:#ccc}.quote-print h1,.quote-print h2{color:#111}.quote-print .print-meta{margin-bottom:15px}.quote-print .print-total{margin-top:15px;text-align:left;font-size:18px;font-weight:bold}}
</style>
</head>
<body>
<div class="status" id="status">اتصال...</div>
<header><h1>الأصيل <span>•</span> عروض الأسعار والطلبات</h1></header>
<main id="app"></main><div id="printArea" class="quote-print"></div>
<nav id="nav" class="hidden"><button data-t="new">💰<br>عرض سعر</button><button data-t="quotes">📋<br>العروض</button><button data-t="prep">📦<br>التحضير</button><button data-t="done">🔔<br>المحضّرة</button><button data-t="people">👥<br>البيانات</button></nav>
<script>
const firebaseConfig={apiKey:'AIzaSyCKW9_6dZXJony37x9Ly6-rWpb1WZF7XVg',authDomain:'aseel-warehouse.firebaseapp.com',projectId:'aseel-warehouse',storageBucket:'aseel-warehouse.firebasestorage.app',messagingSenderId:'533394002034',appId:'1:533394002034:web:cc308c30a25cdceadaf2eb'};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const D=[{id:'p1',name:'مبخرة 3-4'},{id:'p2',name:'مبخرة كريستال'},{id:'p3',name:'دخون كمبودي'},{id:'p4',name:'عود معطر درجة أولى'},{id:'p5',name:'بخور مستكة'},{id:'p6',name:'دهن عود ملكي'}];
let products=[],orders=[],customers=[],packers=[],tab='new',rows=[blankRow()],role=localStorage.getItem('aseel_role')||'',packerId=localStorage.getItem('aseel_packer')||'',unsubs=[],lastPreparedSeen=0;
const app=document.getElementById('app'),navEl=document.getElementById('nav');
function blankRow(){return{product:'',qty:1,bonus:0,unit:'قطعة',price:0}}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(x){alert(x)} function today(){return new Date().toISOString().slice(0,10)}
function wa(p,m){p=String(p||'').replace(/\D/g,'');if(p.startsWith('01'))p='20'+p.slice(1);if(p)window.open('https://wa.me/'+p+'?text='+encodeURIComponent(m),'_blank')}
function setStatus(t){document.getElementById('status').textContent=t}
async function boot(){try{await firebase.auth().signInAnonymously();setStatus('متصل ✓');subscribe();if(!role)roleView();else{navEl.classList.remove('hidden');setupNav();render()}}catch(e){setStatus('خطأ في الاتصال');console.error(e);app.innerHTML='<div class="card"><b>تعذر الاتصال بقاعدة البيانات</b><p class="muted">'+esc(e.message)+'</p></div>'}}
function subscribe(){unsubs.forEach(f=>f());unsubs=[];['products','orders','customers','packers'].forEach(col=>{const u=db.collection(col).onSnapshot(s=>{const a=s.docs.map(d=>({id:d.id,...d.data()}));if(col==='products')products=a.length?a:D;else if(col==='orders')orders=a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));else if(col==='customers')customers=a;else packers=a;if(role){render();checkPreparedAlert()}},e=>{console.error(col,e);setStatus('مشكلة في '+col+': '+e.message)});unsubs.push(u)})}
function roleView(){navEl.classList.add('hidden');app.innerHTML='<div class="login"><div class="card"><h2 style="font:800 1.1rem Cairo">اختيار الجهاز</h2><p class="muted">هذه النسخة للجوال. اختر نوع الجهاز.</p><button id="manager" class="btn">📱 جوال المدير</button><button id="preparer" class="btn ghost" style="margin-top:9px">📦 جوال المُحضّر</button></div></div>';document.getElementById('manager').onclick=()=>chooseRole('manager');document.getElementById('preparer').onclick=()=>chooseRole('preparer')}
function chooseRole(r){if(r==='manager'){role='manager';localStorage.setItem('aseel_role','manager');navEl.classList.remove('hidden');setupNav();render();return}const list=packers.length?packers.map(p=>`<button class="btn ghost pkbtn" data-id="${p.id}" style="margin-top:8px">${esc(p.name)}<br><span class="muted">${esc(p.phone)}</span></button>`).join(''):'<p class="muted">لا يوجد مُحضّرون. أضف المُحضّر من لوحة التحكم أولاً.</p>';app.innerHTML='<div class="login"><div class="card"><h2 style="font:800 1.1rem Cairo">اختر المُحضّر</h2>'+list+'<button id="backRole" class="btn" style="margin-top:12px">‹ رجوع</button></div></div>';document.querySelectorAll('.pkbtn').forEach(b=>b.onclick=()=>{role='preparer';packerId=b.dataset.id;localStorage.setItem('aseel_role','preparer');localStorage.setItem('aseel_packer',packerId);navEl.classList.remove('hidden');setupNav();render()});document.getElementById('backRole').onclick=roleView}
function setupNav(){document.querySelectorAll('nav button').forEach(b=>{b.onclick=()=>nav(b.dataset.t);b.classList.toggle('hidden',role==='preparer'&&['new','quotes','done','people'].includes(b.dataset.t))})}
function nav(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render()}
function customerFields(){return `<div class="field"><label>اسم العميل</label><input id="cn" list="cl" placeholder="اسم العميل"><datalist id="cl">${customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div class="field"><label>رقم العميل</label><input id="cp" inputmode="numeric" placeholder="01xxxxxxxxx"></div>`}
function newView(){if(role!=='manager')return prepList();let h=rows.map((r,i)=>`<div class="item"><select class="p" data-i="${i}"><option value="">الصنف</option>${products.map(p=>`<option value="${p.id}" ${r.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="q" data-i="${i}" type="number" min="1" value="${r.qty}"><input class="pr" data-i="${i}" type="number" min="0" step="0.01" value="${r.price}" placeholder="السعر"><input class="b" data-i="${i}" type="number" min="0" value="${r.bonus}" placeholder="بونص"><button class="x" data-i="${i}">×</button></div>`).join('');app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">إنشاء عرض سعر</h2>${customerFields()}<div class="field"><label>الأصناف — الكمية | السعر | البونص</label><div class="items">${h}</div><button id="add" class="btn ghost sm">+ إضافة صنف</button></div><div class="field"><label>خصم على كامل المبلغ (%)</label><input id="disc" type="number" min="0" max="100" step="0.01" value="0"></div><div class="field"><label>المُحضّر عند اعتماد العرض</label><select id="pk"><option value="">اختيار المُحضّر</option>${packers.map(p=>`<option value="${p.id}">${esc(p.name)} • ${esc(p.phone)}</option>`).join('')}</select></div><div class="field"><label>ملاحظات</label><textarea id="no" rows="2"></textarea></div><div id="calc" class="summary"></div><button id="makeQuote" class="btn">💰 اعمل عرض سعر</button></div>`;bindNew();calcQuote()}
function bindNew(){document.getElementById('cn').onchange=()=>{const c=customers.find(x=>x.name===document.getElementById('cn').value);if(c)document.getElementById('cp').value=c.phone};document.getElementById('add').onclick=()=>{rows.push(blankRow());newView()};document.querySelectorAll('.p').forEach(e=>e.onchange=()=>{rows[e.dataset.i].product=e.value;calcQuote()});document.querySelectorAll('.q').forEach(e=>e.oninput=()=>{rows[e.dataset.i].qty=Number(e.value)||1;calcQuote()});document.querySelectorAll('.pr').forEach(e=>e.oninput=()=>{rows[e.dataset.i].price=Number(e.value)||0;calcQuote()});document.querySelectorAll('.b').forEach(e=>e.oninput=()=>rows[e.dataset.i].bonus=Number(e.value)||0);document.getElementById('disc').oninput=calcQuote;document.querySelectorAll('.x').forEach(e=>e.onclick=()=>{if(rows.length>1){rows.splice(Number(e.dataset.i),1);newView()}});document.getElementById('makeQuote').onclick=makeQuote}
function calc(){const subtotal=rows.filter(r=>r.product).reduce((s,r)=>s+r.qty*r.price,0),discountPercent=Math.min(100,Math.max(0,Number(document.getElementById('disc')?.value)||0)),discount=subtotal*discountPercent/100,total=subtotal-discount;return{subtotal,discountPercent,discount,total}}
function calcQuote(){const el=document.getElementById('calc');if(!el)return;const x=calc();el.innerHTML=`<div><span>الإجمالي قبل الخصم</span><b>${x.subtotal.toFixed(2)}</b></div><div><span>الخصم (${x.discountPercent}%)</span><b>${x.discount.toFixed(2)}</b></div><div class="net"><span>الصافي</span><b>${x.total.toFixed(2)}</b></div>`}
async function makeQuote(){const name=document.getElementById('cn').value.trim(),phone=document.getElementById('cp').value.replace(/\D/g,''),pk=document.getElementById('pk').value,items=rows.filter(r=>r.product).map(r=>{const p=products.find(x=>x.id===r.product);return{product:r.product,name:p?.name||'',qty:Number(r.qty)||1,bonus:Number(r.bonus)||0,unit:r.unit,price:Number(r.price)||0,picked:false}}),x=calc();if(!name||!phone||!pk||!items.length)return toast('أكمل العميل والمُحضّر والأصناف');if(items.some(i=>i.price<0))return toast('راجع الأسعار');try{await saveCustomer(name,phone);const p=packers.find(x=>x.id===pk);const o={number:String(Date.now()).slice(-6),customer:name,phone,date:today(),notes:document.getElementById('no').value.trim(),items,packerId:pk,packerName:p?.name||'',discountPercent:x.discountPercent,subtotal:x.subtotal,discount:x.discount,total:x.total,status:'quote',createdAt:Date.now(),updatedAt:Date.now()};const ref=await db.collection('orders').add(o);rows=[blankRow()];toast('تم حفظ عرض السعر ومزامنته ✓');showQuote(ref.id);nav('quotes')}catch(e){console.error(e);toast('تعذر حفظ عرض السعر: '+e.message)}}
async function saveCustomer(name,phone){const c=customers.find(x=>x.phone===phone);if(c){if(c.name!==name)await db.collection('customers').doc(c.id).update({name,updatedAt:Date.now()})}else await db.collection('customers').add({name,phone,createdAt:Date.now()})}
function quoteList(){if(role!=='manager')return prepList();const a=orders.filter(o=>['quote','preparing','done','invoiced'].includes(o.status));app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">العروض والطلبات</h2>${a.length?a.map(o=>`<div class="order"><div class="top"><b>${esc(o.customer)}</b><span class="badge ${o.status==='done'?'done':''}">${statusText(o.status)}</span></div><div class="muted">#${o.number} • ${o.date} • ${esc(o.packerName||'')}</div><div class="summary" style="margin-top:9px"><div><span>قبل الخصم</span><b>${money(o.subtotal)}</b></div><div><span>الخصم</span><b>${money(o.discount)} (${Number(o.discountPercent||0)}%)</b></div><div class="net"><span>الصافي</span><b>${money(o.total)}</b></div></div><div style="display:grid;gap:7px;margin-top:9px"><button class="btn ghost" onclick="showQuote('${o.id}')">عرض التفاصيل</button>${o.status==='quote'?`<button class="btn ok" onclick="approveOrder('${o.id}')">✅ العميل وافق — تحويل للتحضير</button>`:''}${o.status==='done'?`<button class="btn" onclick="invoice('${o.id}')">🧾 إصدار فاتورة</button>`:''}${o.status==='invoiced'?`<button class="btn blue" onclick="invoice('${o.id}',true)">🧾 عرض الفاتورة</button>`:''}</div></div>`).join(''):'<div class="empty">لا توجد عروض أسعار.</div>'}</div>`}
function statusText(s){return s==='quote'?'عرض سعر':s==='preparing'?'قيد التحضير':s==='done'?'تم التحضير':s==='invoiced'?'تم إصدار الفاتورة':s}
function money(n){return Number(n||0).toFixed(2)}
function prepList(){let a=orders.filter(o=>o.status==='preparing');if(role==='preparer')a=a.filter(o=>o.packerId===packerId);app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">طلبات التحضير</h2>${a.length?a.map(o=>`<div class="order"><div class="top"><b>${esc(o.customer)}</b><span class="badge">قيد التحضير</span></div><div class="muted">#${o.number} • تاريخ التحضير: ${esc(o.preparationDate||o.date)}</div>${o.items.map((x,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(x.name)}</b><div class="muted">الكمية: ${x.qty} ${esc(x.unit)}${x.bonus?' • بونص: '+x.bonus:''}</div></div>`).join('')}${role==='preparer'?`<button class="btn ok" style="margin-top:10px" onclick="finishPrep('${o.id}')">✅ تم التحضير</button>`:''}</div>`).join(''):'<div class="empty">لا توجد طلبات تحضير.</div>'}</div>`}
async function approveOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;try{await db.collection('orders').doc(id).update({status:'preparing',approvedAt:Date.now(),preparationDate:today(),updatedAt:Date.now()});toast('تم تحويل العرض إلى طلبية تحضير ✓')}catch(e){toast('فشل التحويل: '+e.message)}}
async function finishPrep(id){const o=orders.find(x=>x.id===id);if(!o)return;try{await db.collection('orders').doc(id).update({status:'done',preparedAt:Date.now(),updatedAt:Date.now()});toast('تم التحضير ✓ وسيظهر للمدير فوراً')}catch(e){toast('فشل تسجيل التحضير: '+e.message)}}
function doneList(){if(role==='preparer')return prepList();const a=orders.filter(o=>o.status==='done');app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">المحضّرة — إشعارات المدير</h2>${a.length?a.map(o=>`<div class="order"><div class="top"><b>${esc(o.customer)}</b><span class="badge done">تم التحضير ✓</span></div><div class="muted">#${o.number} • ${o.preparedAt?new Date(o.preparedAt).toLocaleString('ar-EG'):o.date}</div><button class="btn" style="margin-top:10px" onclick="invoice('${o.id}')">🧾 إصدار فاتورة</button></div>`).join(''):'<div class="empty">لا توجد طلبات تم تحضيرها.</div>'}</div>`}
function showQuote(id){const o=orders.find(x=>x.id===id);if(!o)return;const p=packers.find(x=>x.id===o.packerId);app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">عرض سعر #${esc(o.number)}</h2><div class="muted">${esc(o.customer)} • ${esc(o.phone)} • ${esc(o.date)}</div>${o.items.map(x=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0"><span>${esc(x.name)}<br><small class="muted">${x.qty} ${esc(x.unit)}${x.bonus?' + بونص '+x.bonus:''}</small></span><b>${money(x.qty*x.price)}</b></div>`).join('')}<div class="summary" style="margin-top:10px"><div><span>الإجمالي قبل الخصم</span><b>${money(o.subtotal)}</b></div><div><span>الخصم (${Number(o.discountPercent||0)}%)</span><b>${money(o.discount)}</b></div><div class="net"><span>الصافي</span><b>${money(o.total)}</b></div></div><div class="muted" style="margin-top:10px">المُحضّر: ${esc(p?.name||o.packerName||'')}</div><div style="display:grid;gap:7px;margin-top:12px"><button class="btn blue" onclick="printQuote('${o.id}')">📄 تصدير / حفظ PDF</button><button class="btn wa" onclick="sendQuoteWA('${o.id}')">📲 إرسال العرض للعميل واتساب</button>${o.status==='quote'?`<button class="btn ok" onclick="approveOrder('${o.id}')">✅ العميل وافق — تحويل للتحضير</button>`:''}${o.status==='done'?`<button class="btn" onclick="invoice('${o.id}')">🧾 إصدار فاتورة</button>`:''}</div></div>`}
function printQuote(id){const o=orders.find(x=>x.id===id);if(!o)return;document.getElementById('printArea').innerHTML=`<h1>الأصيل</h1><h2>عرض سعر #${esc(o.number)}</h2><div class="print-meta"><b>العميل:</b> ${esc(o.customer)}<br><b>الهاتف:</b> ${esc(o.phone)}<br><b>التاريخ:</b> ${esc(o.date)}</div><table><tr><th>الصنف</th><th>الكمية</th><th>البونص</th><th>السعر</th><th>الإجمالي</th></tr>${o.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${x.bonus||0}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</table><div class="print-total">قبل الخصم: ${money(o.subtotal)}<br>خصم ${Number(o.discountPercent||0)}%: ${money(o.discount)}<br>الصافي: ${money(o.total)}</div><p>${esc(o.notes||'')}</p>`;setTimeout(()=>window.print(),50)}
function sendQuoteWA(id){const o=orders.find(x=>x.id===id);if(!o)return;const msg=`عرض سعر #${o.number}\nالعميل: ${o.customer}\n${o.items.map(x=>`• ${x.name} — ${x.qty} ${x.unit} × ${money(x.price)}`).join('\n')}\nالإجمالي قبل الخصم: ${money(o.subtotal)}\nالخصم: ${Number(o.discountPercent||0)}% = ${money(o.discount)}\nالصافي: ${money(o.total)}\n\nللموافقة على العرض يرجى الرد بالموافقة.`;wa(o.phone,msg)}
function invoice(id,viewOnly=false){const o=orders.find(x=>x.id===id);if(!o)return;const html=`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فاتورة #${esc(o.number)}</title><style>body{font-family:Arial;padding:30px;color:#111}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ccc;padding:9px;text-align:right}.total{font-size:20px;font-weight:bold;margin-top:20px}</style></head><body><h1>شركة الأصيل</h1><h2>فاتورة #${esc(o.number)}</h2><p>العميل: ${esc(o.customer)}<br>الهاتف: ${esc(o.phone)}<br>التاريخ: ${esc(o.date)}</p><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${o.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</table><div class="total">قبل الخصم: ${money(o.subtotal)}<br>الخصم: ${Number(o.discountPercent||0)}% — ${money(o.discount)}<br>الصافي: ${money(o.total)}</div><script>${viewOnly?'':'window.onload=()=>window.print()'}<\/script></body></html>`;if(!viewOnly)db.collection('orders').doc(id).update({status:'invoiced',invoicedAt:Date.now(),updatedAt:Date.now()}).catch(e=>toast('تعذر تحديث الفاتورة: '+e.message));const w=window.open('','_blank');w.document.write(html);w.document.close()}
function people(){app.innerHTML='<div class="card"><h2 style="font:800 1rem Cairo">العملاء والمحضّرون</h2><h3>المحضّرون</h3>'+packers.map(p=>`<p>${esc(p.name)} — ${esc(p.phone)}</p>`).join('')+'<h3>العملاء</h3>'+customers.map(c=>`<p>${esc(c.name)} — ${esc(c.phone)}</p>`).join('')+'</div>'}
function checkPreparedAlert(){if(role!=='manager')return;const newest=orders.find(o=>o.status==='done');if(newest&&newest.preparedAt&&newest.preparedAt>lastPreparedSeen){lastPreparedSeen=newest.preparedAt;const el=document.createElement('div');el.className='alert';el.innerHTML=`🔔 تم تحضير طلبية العميل <b>${esc(newest.customer)}</b> — #${esc(newest.number)}<br><button class="btn" style="margin-top:8px" onclick="nav('done')">فتح الطلبية وإصدار الفاتورة</button>`;app.prepend(el)}}
function render(){if(tab==='new')newView();else if(tab==='quotes')quoteList();else if(tab==='prep')prepList();else if(tab==='done')doneList();else people()}
navEl.classList.add('hidden');boot();
// إزالة أي Service Worker قديم حتى لا يمنع تحميل النسخة الجديدة أو يسبب بيانات قديمة.
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{}));
</script></body></html>
