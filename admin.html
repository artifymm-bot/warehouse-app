<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأصيل - لوحة التحكم</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>:root{--bg:#15110d;--card:#1d1712;--text:#ede6d8;--muted:#a89c89;--line:#3a322b;--a:#c6501f;--ok:#4c8b5b;--danger:#9c3d35;--blue:#315f88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}header{padding:18px 28px;border-bottom:1px solid var(--line);background:#15110df5;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header span{color:#e6712e}.wrap{max-width:1250px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:220px 1fr;gap:18px}.side,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.side{padding:10px;height:max-content;position:sticky;top:90px}.side button{width:100%;border:0;background:none;color:var(--muted);padding:13px;text-align:right;border-radius:9px;font-size:15px}.side button.active,.side button:hover{background:#2a2019;color:#fff}.card{padding:20px;margin-bottom:16px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select{width:100%;background:#18130f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.danger{background:var(--danger)}.blue{background:var(--blue)}.actions{display:flex;gap:7px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#18130f;border:1px solid var(--line);border-radius:10px;padding:16px}.stat b{display:block;font-size:25px;margin-top:7px}table{width:100%;border-collapse:collapse}th,td{padding:11px 7px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{color:var(--muted)}.badge{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 8px;font-size:11px}.notice{padding:14px;border:1px solid #6b4d27;background:#21180f;border-radius:10px;margin-bottom:15px}.oktxt{color:#6bb57c}.errtxt{color:#e58b7e}.hidden{display:none!important}.empty{padding:25px;text-align:center;color:var(--muted)}.dirty{border-color:#9b6a32}.savebar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#241c16;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:14px}.savebar span{font-size:12px;color:var(--muted)}@media(max-width:800px){body:before{content:'لوحة التحكم متاحة على الكمبيوتر فقط';position:fixed;inset:0;background:#15110d;color:#ede6d8;z-index:9999;display:flex;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:30px}.wrap,header{display:none}}</style></head><body><header><h1>الأصيل <span>•</span> لوحة التحكم</h1></header><div class="wrap"><div id="connection" class="notice">⏳ جاري الاتصال بقاعدة البيانات...</div><div class="grid"><aside class="side"><button data-tab="dashboard" class="active">📊 الرئيسية</button><button data-tab="products">🏷️ الأصناف</button><button data-tab="packers">📦 المُحضّرون</button><button data-tab="customers">👥 العملاء</button><button data-tab="orders">🧾 الطلبات</button><button data-tab="users">🔐 الصلاحيات</button></aside><main id="content"><div class="card"><h2>جاري تحميل البيانات...</h2></div></main></div></div><script>
const firebaseConfig={apiKey:'AIzaSyCKW9_6dZXJony37x9Ly6-rWpb1WZF7XVg',authDomain:'aseel-warehouse.firebaseapp.com',projectId:'aseel-warehouse',storageBucket:'aseel-warehouse.firebasestorage.app',messagingSenderId:'533394002034',appId:'1:533394002034:web:cc308c30a25cdceadaf2eb'};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let products=[],packers=[],customers=[],orders=[],users=[],tab='dashboard',ready=false,dirty=false;
const c=document.getElementById('content'),conn=document.getElementById('connection');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const toast=x=>alert(x);function setConn(t,ok=true){conn.innerHTML=(ok?'🟢 ':'🔴 ')+t;conn.className='notice '+(ok?'oktxt':'errtxt')}
function nav(){document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('active',x===b));render()})}
function render(){if(!ready)return;if(tab==='dashboard')dashboard();else if(tab==='products')productsView();else if(tab==='packers')packersView();else if(tab==='customers')customersView();else if(tab==='orders')ordersView();else usersView()}
function dashboard(){c.innerHTML=`<div class="card"><h2>لوحة المعلومات</h2><div class="stats"><div class="stat">الأصناف<b>${products.length}</b></div><div class="stat">المُحضّرون<b>${packers.length}</b></div><div class="stat">العملاء<b>${customers.length}</b></div><div class="stat">إجمالي الطلبات<b>${orders.length}</b></div></div></div><div class="card"><h2>حالة الطلبات</h2><table><tr><th>الحالة</th><th>العدد</th></tr><tr><td>عروض أسعار</td><td>${orders.filter(x=>x.status==='quote').length}</td></tr><tr><td>قيد التحضير</td><td>${orders.filter(x=>x.status==='preparing').length}</td></tr><tr><td>في انتظار المراجعة</td><td>${orders.filter(x=>x.status==='review').length}</td></tr><tr><td>تمت المراجعة</td><td>${orders.filter(x=>x.status==='done').length}</td></tr></table></div>`}
function productsView(){c.innerHTML=`<div class="card"><h2>إدارة الأصناف</h2><div class="form"><div class="field"><label>اسم الصنف</label><input id="pn" placeholder="مثال: مبخرة كريستال"></div><div class="field"><label>الوحدة</label><select id="pu"><option>قطعة</option><option>كرتونة</option><option>كيلو</option></select></div><div class="field"><label>الحالة</label><select id="pa"><option value="true">نشط</option><option value="false">متوقف</option></select></div><div style="display:flex;align-items:end"><button class="btn" id="addp">+ إضافة للصورة</button></div></div></div><div class="card"><h3>الأصناف المحفوظة</h3>${products.length?`<table><tr><th>الصنف</th><th>الوحدة</th><th>الحالة</th><th>تعديل</th><th>حذف</th></tr>${products.map(p=>`<tr><td><input id="pn_${p.id}" value="${esc(p.name)}"></td><td><select id="pu_${p.id}"><option ${p.unit==='قطعة'||!p.unit?'selected':''}>قطعة</option><option ${p.unit==='كرتونة'?'selected':''}>كرتونة</option><option ${p.unit==='كيلو'?'selected':''}>كيلو</option></select></td><td><select id="pa_${p.id}"><option value="true" ${p.active!==false?'selected':''}>نشط</option><option value="false" ${p.active===false?'selected':''}>متوقف</option></select></td><td><button class="btn ghost" onclick="markProduct('${p.id}')">تعديل</button></td><td><button class="btn danger" onclick="removeProduct('${p.id}')">حذف</button></td></tr>`).join('')}`:'<div class="empty">لا توجد أصناف محفوظة.</div>'}<div class="savebar"><span>${dirty?'لديك تغييرات غير محفوظة':'كل التغييرات محفوظة'}</span><button class="btn" onclick="saveProducts()">💾 حفظ التغييرات</button></div></div>`;document.getElementById('addp').onclick=addProduct}
function markProduct(id){dirty=true;document.getElementById('pn_'+id).classList.add('dirty');toast('تم تعديل الصنف محلياً. اضغط حفظ التغييرات لحفظه في Firestore.')}
async function addProduct(){let name=document.getElementById('pn').value.trim(),unit=document.getElementById('pu').value,active=document.getElementById('pa').value==='true';if(!name)return toast('اكتب اسم الصنف');try{await db.collection('products').add({name,unit,active,createdAt:Date.now(),updatedAt:Date.now()});dirty=false;toast('تم حفظ الصنف في قاعدة البيانات ✓')}catch(e){toast('فشل الحفظ: '+e.message)}}
async function saveProducts(){try{const batch=db.batch();products.forEach(p=>{const name=document.getElementById('pn_'+p.id)?.value.trim();const unit=document.getElementById('pu_'+p.id)?.value;const active=document.getElementById('pa_'+p.id)?.value==='true';if(name)batch.update(db.collection('products').doc(p.id),{name,unit,active,updatedAt:Date.now()})});await batch.commit();dirty=false;toast('تم حفظ كل تغييرات الأصناف ✓');render()}catch(e){toast('فشل حفظ التغييرات: '+e.message)}}
async function removeProduct(id){if(!confirm('حذف الصنف؟'))return;try{await db.collection('products').doc(id).delete();toast('تم الحذف ✓')}catch(e){toast('فشل الحذف: '+e.message)}}
function packersView(){c.innerHTML=`<div class="card"><h2>إدارة المُحضّرين</h2><div class="form"><div class="field"><label>الاسم</label><input id="kn"></div><div class="field"><label>الهاتف</label><input id="kp"></div><div class="field"><label>الحالة</label><select id="ka"><option value="true">نشط</option><option value="false">متوقف</option></select></div><div style="display:flex;align-items:end"><button class="btn" id="addk">+ إضافة للمسودة</button></div></div></div><div class="card"><h3>المُحضّرون المحفوظون</h3>${packers.length?`<table><tr><th>الاسم</th><th>الهاتف</th><th>الحالة</th><th>تعديل</th><th>حذف</th></tr>${packers.map(p=>`<tr><td><input id="kn_${p.id}" value="${esc(p.name)}"></td><td><input id="kp_${p.id}" value="${esc(p.phone)}"></td><td><select id="ka_${p.id}"><option value="true" ${p.active!==false?'selected':''}>نشط</option><option value="false" ${p.active===false?'selected':''}>متوقف</option></select></td><td><button class="btn ghost" onclick="markPacker('${p.id}')">تعديل</button></td><td><button class="btn danger" onclick="removePacker('${p.id}')">حذف</button></td></tr>`).join('')}`:'<div class="empty">لا يوجد مُحضّرون محفوظون.</div>'}<div class="savebar"><span>${dirty?'لديك تغييرات غير محفوظة':'كل التغييرات محفوظة'}</span><button class="btn" onclick="savePackers()">💾 حفظ التغييرات</button></div></div>`;document.getElementById('addk').onclick=addPacker}
function markPacker(id){dirty=true;document.getElementById('kn_'+id).classList.add('dirty');toast('تم تعديل المُحضّر محلياً. اضغط حفظ التغييرات.')}
async function addPacker(){let name=document.getElementById('kn').value.trim(),phone=document.getElementById('kp').value.replace(/\D/g,''),active=document.getElementById('ka').value==='true';if(!name||!phone)return toast('أكمل الاسم والهاتف');try{await db.collection('packers').add({name,phone,active,createdAt:Date.now(),updatedAt:Date.now()});dirty=false;toast('تم حفظ المُحضّر في قاعدة البيانات ✓')}catch(e){toast('فشل الحفظ: '+e.message)}}
async function savePackers(){try{const batch=db.batch();packers.forEach(p=>{const name=document.getElementById('kn_'+p.id)?.value.trim();const phone=document.getElementById('kp_'+p.id)?.value.replace(/\D/g,'');const active=document.getElementById('ka_'+p.id)?.value==='true';if(name&&phone)batch.update(db.collection('packers').doc(p.id),{name,phone,active,updatedAt:Date.now()})});await batch.commit();dirty=false;toast('تم حفظ كل تغييرات المُحضّرين ✓');render()}catch(e){toast('فشل حفظ التغييرات: '+e.message)}}
async function removePacker(id){if(confirm('حذف المُحضّر؟'))try{await db.collection('packers').doc(id).delete();toast('تم الحذف ✓')}catch(e){toast('فشل الحذف: '+e.message)}}
function customersView(){c.innerHTML=`<div class="card"><h2>العملاء المحفوظون</h2>${customers.length?`<table><tr><th>الاسم</th><th>الهاتف</th><th>تاريخ الإضافة</th><th></th></tr>${customers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${new Date(x.createdAt||Date.now()).toLocaleDateString('ar-EG')}</td><td><button class="btn danger" onclick="removeCustomer('${x.id}')">حذف</button></td></tr>`).join('')}</table>`:'<div class="empty">لا يوجد عملاء محفوظون.</div>'}</div>`}
async function removeCustomer(id){if(confirm('حذف العميل؟'))try{await db.collection('customers').doc(id).delete();toast('تم الحذف ✓')}catch(e){toast('فشل الحذف: '+e.message)}}
function ordersView(){c.innerHTML=`<div class="card"><h2>كل الطلبات وعروض الأسعار</h2>${orders.length?`<table><tr><th>رقم</th><th>العميل</th><th>المُحضّر</th><th>التاريخ</th><th>الحالة</th></tr>${orders.map(o=>`<tr><td>#${esc(o.number)}</td><td>${esc(o.customer)}</td><td>${esc(o.packerName||'لم يُحدد بعد')}</td><td>${esc(o.date)}</td><td><span class="badge">${statusText(o.status)}</span></td></tr>`).join('')}</table>`:'<div class="empty">لا توجد طلبات محفوظة.</div>'}</div>`}
function statusText(s){return s==='quote'?'عرض سعر':s==='preparing'?'قيد التحضير':s==='review'?'في انتظار المراجعة':s==='done'?'تمت المراجعة':s==='invoiced'?'تم إصدار الفاتورة':s}
function usersView(){c.innerHTML=`<div class="card"><h2>الصلاحيات</h2><p class="muted">هذا القسم مخصص لسجلات الأدوار. الأمان النهائي سيُربط لاحقاً بحسابات Firebase Auth.</p>${users.length?`<table><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td><button class="btn danger" onclick="removeUser('${u.id}')">حذف</button></td></tr>`).join('')}</table>`:'<div class="empty">لا توجد سجلات صلاحيات مقروءة.</div>'}</div>`}
async function removeUser(id){if(confirm('حذف سجل الصلاحية؟'))try{await db.collection('users').doc(id).delete()}catch(e){toast('فشل الحذف: '+e.message)}}
function subscribe(){const cols=['products','packers','customers','orders','users'];let count=0;cols.forEach(col=>db.collection(col).onSnapshot(s=>{const a=s.docs.map(d=>({id:d.id,...d.data()}));if(col==='products')products=a;else if(col==='packers')packers=a;else if(col==='customers')customers=a;else if(col==='orders')orders=a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));else users=a;if(['products','packers','customers','orders'].includes(col))count++;if(count>=4){ready=true;setConn('متصل — البيانات محفوظة في Firestore وتتزامن تلقائياً ✓');render()}},e=>{console.error(col,e);if(col!=='users')setConn('مشكلة في '+col+': '+e.message,false)}))}
async function boot(){nav();try{await firebase.auth().signInAnonymously();setConn('تم الاتصال بحساب الجهاز ✓');subscribe()}catch(e){setConn('فشل تسجيل الدخول إلى Firebase: '+e.message,false);c.innerHTML='<div class="card"><h2>تعذر الاتصال</h2><p>'+esc(e.message)+'</p></div>'}}
boot();
</script></body></html>
