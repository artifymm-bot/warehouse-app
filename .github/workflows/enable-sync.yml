name: Enable warehouse sync

on:
  push:
    paths:
      - '.github/workflows/enable-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register service worker
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* aseel-sw-registration */'
          if marker not in s:
              code = '<script>/* aseel-sw-registration */\nif (\'serviceWorker\' in navigator) { navigator.serviceWorker.register(\'./service-worker.js\').catch(function(e){ console.error(\'SW registration failed\',e); }); }\n</script>'
              if '</body>' not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace('</body>', code + '</body>', 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change needed'
          else
            git commit -m 'Register service worker for cross-device sync'
            git push
          fi
