<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15110d"><title>الأصيل - إدارة الطلبات</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>:root{--bg:#15110d;--card:#1d1712;--text:#ede6d8;--muted:#a89c89;--line:#3a322b;--a:#c6501f;--ok:#4c8b5b;--danger:#9c3d35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:IBM Plex Sans Arabic,sans-serif;padding-bottom:78px}header{padding:15px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#15110df5;z-index:5}header h1{margin:0;font:800 1.05rem Cairo}header span{color:#e6712e}main{max-width:700px;margin:auto;padding:14px}.card,.order{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}.field{margin-bottom:13px}label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:5px}input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.btn{border:0;border-radius:8px;padding:11px 14px;width:100%;background:var(--a);color:#fff;font-weight:700}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.ok{background:var(--ok)}.wa{background:#28613e}.danger{background:var(--danger)}.sm{width:auto;padding:8px 11px;font-size:.8rem}.muted{color:var(--muted);font-size:.8rem}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:.7rem;color:var(--muted);white-space:nowrap}.done{color:#6bb57c;border-color:var(--ok)}.check{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px solid var(--line)}.check input{width:23px}.check .name{flex:1}.picked{text-decoration:line-through;color:var(--muted)}.items{overflow:auto}.item{display:grid;grid-template-columns:1.4fr .55fr .55fr .65fr 28px;gap:6px;margin-bottom:7px}.item input,.item select{padding:8px;font-size:.78rem}.x{background:none;border:0;color:var(--muted);font-size:1.1rem}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10}nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px;font-size:.68rem}nav button.active{color:#e6712e}nav b{display:block;font-size:1.1rem}.hidden{display:none!important}.login{min-height:75vh;display:flex;align-items:center;justify-content:center}.login .card{width:min(430px,100%);text-align:center}.status{position:fixed;top:7px;left:8px;font-size:.65rem;color:#6bb57c;z-index:20}table{width:100%;border-collapse:collapse;font-size:.75rem}th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}.invoice{display:none}@media print{body>*{display:none!important}.invoice{display:block!important;color:#111;background:#fff;padding:20px}.invoice table{color:#111}.invoice th,.invoice td{border-color:#ddd}}</style></head><body><div class="status" id="status">اتصال...</div><header><h1>الأصيل <span>•</span> إدارة الطلبات</h1></header><main id="app"></main><nav id="nav" class="hidden"><button data-t="new">📝<br>طلب جديد</button><button data-t="pending">📦<br>التحضير</button><button data-t="done">✅<br>المحضّرة</button><button data-t="people">👥<br>المحفوظون</button><button data-t="products">🏷️<br>الأصناف</button></nav><script>
const firebaseConfig={apiKey:'AIzaSyCKW9_6dZXJony37x9Ly6-rWpb1WZF7XVg',authDomain:'aseel-warehouse.firebaseapp.com',projectId:'aseel-warehouse',storageBucket:'aseel-warehouse.firebasestorage.app',messagingSenderId:'533394002034',appId:'1:533394002034:web:cc308c30a25cdceadaf2eb'};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const D=[{id:'p1',name:'مبخرة 3-4'},{id:'p2',name:'مبخرة كريستال'},{id:'p3',name:'دخون كمبودي'},{id:'p4',name:'عود معطر درجة أولى'},{id:'p5',name:'بخور مستكة'},{id:'p6',name:'دهن عود ملكي'}];
let products=[],orders=[],customers=[],packers=[],tab='new',rows=[{product:'',qty:1,bonus:0,unit:'قطعة'}],role=localStorage.getItem('aseel_role')||'',packerId=localStorage.getItem('aseel_packer')||'',unsubs=[];
const app=document.getElementById('app'),navEl=document.getElementById('nav');
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(x){alert(x)}function date(){return new Date().toISOString().slice(0,10)}function wa(p,m){p=String(p||'').replace(/\D/g,'');if(p.startsWith('01'))p='20'+p.slice(1);window.open('https://wa.me/'+p+'?text='+encodeURIComponent(m),'_blank')}
function setStatus(t){document.getElementById('status').textContent=t}
async function boot(){try{await firebase.auth().signInAnonymously();setStatus('متصل ✓');subscribe();if(!role)roleView();else{navEl.classList.remove('hidden');setupNav();render()}}catch(e){setStatus('خطأ في الاتصال');console.error(e);app.innerHTML='<div class="card"><b>تعذر الاتصال بقاعدة البيانات</b><p class="muted">'+esc(e.message)+'</p></div>'}}
function subscribe(){unsubs.forEach(f=>f());unsubs=[];['products','orders','customers','packers'].forEach(col=>{let u=db.collection(col).onSnapshot(s=>{let a=s.docs.map(d=>({id:d.id,...d.data()}));if(col==='products')products=a.length?a:D;else if(col==='orders')orders=a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));else if(col==='customers')customers=a;else packers=a;if(role)render()},e=>{console.error(col,e);setStatus('مشكلة في '+col+': '+e.message) });unsubs.push(u)})}
function roleView(){navEl.classList.add('hidden');app.innerHTML='<div class="login"><div class="card"><h2 style="font:800 1.1rem Cairo">اختيار الجهاز</h2><p class="muted">هذه النسخة تعمل على الجوال فقط. اختر نوع الجهاز مرة واحدة.</p><button id="manager" class="btn">📱 جوال المدير</button><button id="preparer" class="btn ghost" style="margin-top:9px">📦 جوال المُحضّر</button></div></div>';document.getElementById('manager').onclick=()=>chooseRole('manager');document.getElementById('preparer').onclick=()=>chooseRole('preparer')}
function chooseRole(r){if(r==='manager'){role='manager';localStorage.setItem('aseel_role',role);navEl.classList.remove('hidden');setupNav();render();return}let list=packers.length?packers.map(p=>`<button class="btn ghost pkbtn" data-id="${p.id}" style="margin-top:8px">${esc(p.name)}<br><span class="muted">${esc(p.phone)}</span></button>`).join(''):'<p class="muted">لا يوجد مُحضّرون بعد. افتح التطبيق على جوال المدير وأضف المُحضّر أولاً.</p>';app.innerHTML='<div class="login"><div class="card"><h2 style="font:800 1.1rem Cairo">اختر المُحضّر</h2>'+list+'<button id="backRole" class="btn" style="margin-top:12px">‹ رجوع</button></div></div>';document.querySelectorAll('.pkbtn').forEach(b=>b.onclick=()=>{role='preparer';packerId=b.dataset.id;localStorage.setItem('aseel_role',role);localStorage.setItem('aseel_packer',packerId);navEl.classList.remove('hidden');setupNav();render()});document.getElementById('backRole').onclick=roleView}
function setupNav(){document.querySelectorAll('nav button').forEach(b=>{b.onclick=()=>nav(b.dataset.t);b.classList.toggle('hidden',role==='preparer'&&['new','done','people','products'].includes(b.dataset.t))})}
function nav(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render()}
function newView(){if(role!=='manager')return list(false);let h=rows.map((r,i)=>`<div class="item"><select class="p" data-i="${i}"><option value="">الصنف</option>${products.map(p=>`<option value="${p.id}" ${r.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input class="q" data-i="${i}" type="number" min="1" value="${r.qty}"><input class="b" data-i="${i}" type="number" min="0" value="${r.bonus}"><select class="u" data-i="${i}"><option ${r.unit==='قطعة'?'selected':''}>قطعة</option><option ${r.unit==='كرتونة'?'selected':''}>كرتونة</option></select><button class="x" data-i="${i}">×</button></div>`).join('');app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">طلبية جديدة</h2><div class="field"><label>اسم المرسل إليه</label><input id="cn" list="cl" placeholder="اسم العميل"><datalist id="cl">${customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div class="field"><label>رقم المرسل إليه</label><input id="cp" inputmode="numeric" placeholder="01xxxxxxxxx"></div><div class="field"><label>الأصناف — بدون أسعار</label><div class="muted">الكمية | بونص | الوحدة</div><div class="items">${h}</div><button id="add" class="btn ghost sm">+ إضافة صنف</button></div><div class="field"><label>المُحضّر</label><select id="pk"><option value="">اختيار المُحضّر</option>${packers.map(p=>`<option value="${p.id}">${esc(p.name)} • ${esc(p.phone)}</option>`).join('')}</select></div><div class="field"><label>ملاحظات</label><textarea id="no" rows="2"></textarea></div><button id="create" class="btn">📦 إنشاء وإرسال الطلبية</button></div>`;document.getElementById('cn').onchange=()=>{let c=customers.find(x=>x.name===document.getElementById('cn').value);if(c)document.getElementById('cp').value=c.phone};document.getElementById('add').onclick=()=>{rows.push({product:'',qty:1,bonus:0,unit:'قطعة'});newView()};document.querySelectorAll('.p').forEach(e=>e.onchange=()=>rows[e.dataset.i].product=e.value);document.querySelectorAll('.q').forEach(e=>e.oninput=()=>rows[e.dataset.i].qty=+e.value||1);document.querySelectorAll('.b').forEach(e=>e.oninput=()=>rows[e.dataset.i].bonus=+e.value||0);document.querySelectorAll('.u').forEach(e=>e.onchange=()=>rows[e.dataset.i].unit=e.value);document.querySelectorAll('.x').forEach(e=>e.onclick=()=>{if(rows.length>1){rows.splice(+e.dataset.i,1);newView()}});document.getElementById('create').onclick=create}
async function create(){let name=document.getElementById('cn').value.trim(),phone=document.getElementById('cp').value.replace(/\D/g,''),pk=document.getElementById('pk').value,items=rows.filter(r=>r.product).map(r=>{let p=products.find(x=>x.id===r.product);return{...r,name:p.name,picked:false,price:0}});if(!name||!phone||!pk||!items.length)return toast('أكمل بيانات العميل والمُحضّر والأصناف');try{let c=customers.find(x=>x.phone===phone);if(!c)await db.collection('customers').add({name,phone,createdAt:Date.now()});let p=packers.find(x=>x.id===pk),o={number:String(Date.now()).slice(-6),customer:name,phone,date:date(),notes:document.getElementById('no').value.trim(),items,packerId:pk,packerName:p.name,status:'sent',createdAt:Date.now()};let ref=await db.collection('orders').add(o);wa(p.phone,`طلبية تحضير #${o.number}\nالمرسل إليه: ${o.customer}\n${items.map(x=>`• ${x.name} — ${x.qty} ${x.unit}${x.bonus?' + بونص '+x.bonus:''}`).join('\n')}${o.notes?'\nملاحظات: '+o.notes:''}\n\nبعد الانتهاء اضغط تم التحضير ✅`);rows=[{product:'',qty:1,bonus:0,unit:'قطعة'}];toast('تم إرسال الطلبية ✓');nav('pending')}catch(e){console.error(e);toast('تعذر حفظ الطلبية: '+e.message)}}
function list(done){let a=orders.filter(o=>done?o.status==='done':o.status!=='done');if(role==='preparer')a=a.filter(o=>o.packerId===packerId);app.innerHTML=`<div class="card"><h2 style="font:800 1rem Cairo">${done?'سجل الطلبات المحضّرة':'طلبات التحضير'}</h2>${a.length?a.map(o=>`<div class="order" data-id="${o.id}"><div class="top"><b>${esc(o.customer)}</b><span class="badge ${o.status==='done'?'done':''}">${o.status==='done'?'تم التحضير ✓':'قيد التحضير'}</span></div><div class="muted">#${o.number} • ${o.date} • ${o.items.length} صنف${role==='manager'?' • '+esc(o.packerName):''}</div>${o.items.map((x,i)=>`<div class="check"><input type="checkbox" ${x.picked?'checked':''} ${role==='manager'||o.status==='done'?'disabled':''} data-oid="${o.id}" data-i="${i}"><span class="name ${x.picked?'picked':''}">${esc(x.name)} — ${x.qty} ${esc(x.unit)}${x.bonus?' + بونص '+x.bonus:''}</span></div>`).join('')}${role==='preparer'&&o.status!=='done'?`<button class="btn ok doneBtn" data-id="${o.id}" style="margin-top:10px">✅ تم التحضير</button>`:''}${role==='manager'&&o.status==='done'?`<button class="btn" onclick="invoice('${o.id}')" style="margin-top:10px">🧾 تحويل إلى فاتورة</button>`:''}</div>`).join(''):'<div class="empty">لا توجد طلبات هنا.</div>'}</div>`;document.querySelectorAll('.check input:not([disabled])').forEach(e=>e.onchange=async()=>{let o=orders.find(x=>x.id===e.dataset.oid);if(!o)return;o.items[+e.dataset.i].picked=e.checked;await db.collection('orders').doc(o.id).update({items:o.items})});document.querySelectorAll('.doneBtn').forEach(e=>e.onclick=async()=>{let o=orders.find(x=>x.id===e.dataset.id);if(!o)return;if(!o.items.every(x=>x.picked))return toast('يجب تحديد كل الأصناف أولاً');try{await db.collection('orders').doc(o.id).update({status:'done',preparedAt:Date.now(),items:o.items});toast('تم تسجيل التحضير ✓')}catch(err){toast('فشل التحديث: '+err.message)}})}
function people(){app.innerHTML='<div class="card"><h2 style="font:800 1rem Cairo">العملاء والمحضّرون</h2><h3>المحضّرون</h3>'+packers.map(p=>`<p>${esc(p.name)} — ${esc(p.phone)}</p>`).join('')+'<h3>العملاء</h3>'+customers.map(c=>`<p>${esc(c.name)} — ${esc(c.phone)}</p>`).join('')+'</div>'}
function productsView(){app.innerHTML='<div class="card"><h2 style="font:800 1rem Cairo">الأصناف</h2>'+products.map(p=>`<p>${esc(p.name)}</p>`).join('')+'</div>'}
function render(){if(tab==='new')newView();else if(tab==='pending')list(false);else if(tab==='done')list(true);else if(tab==='people')people();else productsView()}
function invoice(id){let o=orders.find(x=>x.id===id);if(!o)return;let prices=o.items.map(x=>Number(prompt('سعر '+x.name+' — '+x.qty+' '+x.unit,x.price||0))||0);let total=o.items.reduce((s,x,i)=>s+x.qty*prices[i],0);db.collection('orders').doc(id).update({items:o.items.map((x,i)=>({...x,price:prices[i]})),invoiceTotal:total,invoicedAt:Date.now(),status:'invoiced'}).then(()=>{let w=window.open('','_blank');w.document.write('<html dir="rtl"><body><h2>فاتورة #'+esc(o.number)+'</h2><p>'+esc(o.customer)+'</p><table border="1" cellpadding="8"><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>'+o.items.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+prices[i]+'</td><td>'+x.qty*prices[i]+'</td></tr>').join('')+'<tr><th colspan="3">الإجمالي</th><th>'+total+'</th></tr></table></body></html>');w.document.close();w.print()}).catch(e=>toast('فشل الفاتورة: '+e.message))}
navEl.classList.add('hidden');boot();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
